    ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 8; ctx.stroke();
    ctx.strokeStyle = COLORS.cream; ctx.lineWidth = 3.6; ctx.stroke();
    ctx.restore();
  }

  // ===== 3. HUD (캔버스) =====
  const HUD = {
    scoreShown: 0, lastScore: 0, scorePop: -99,
    comboPop: -99, comboLast: 0, ghost: null,
    hitT: -99,
    readyAt: [-99, -99, -99], lastCd: [0, 0, 0],
    boss: null, bossT: -99, bossLag: 1,
    touchSkill: [null, null, null],
  };

  function hudVignette(ctx, p, now, calm) {
    let a = 0;
    if (p && !p.dead && p.maxHp > 0 && p.hp / p.maxHp <= T.hud.lowHpRatio) {
      a += calm ? 0.16 : 0.09 + (T.hud.vignetteMax - 0.09) * (0.5 + 0.5 * Math.sin(now * 0.07));   // 1.5초 주기로 천천히 (깜빡임 아님)
    }
    const age = now - HUD.hitT;
    if (age >= 0 && age < T.hud.hitFlashFrames) a += (calm ? 0.1 : T.hud.hitFlashAlpha) * (1 - age / T.hud.hitFlashFrames);
    if (a <= 0.004) return;
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.38, W / 2, H / 2, H * 1.0);
    g.addColorStop(0, 'rgba(255,60,90,0)'); g.addColorStop(1, 'rgba(255,60,90,' + Math.min(a, 0.45).toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function hudHp(ctx, p, now, calm) {
    const maxHp = p && p.maxHp > 0 ? p.maxHp : 100;
    const hp = p ? clamp(Math.ceil(p.hp || 0), 0, maxHp) : maxHp;
    const ratio = hp / maxHp, low = !!p && hp > 0 && ratio <= T.hud.lowHpRatio;
    ctx.save();
    Draw.roundRect(ctx, 10, 8, 304, 86, 18); ctx.fillStyle = 'rgba(43,27,58,.62)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke();
    const beat = low && !calm ? 1 + 0.12 * Math.max(0, Math.sin(now * 0.14)) : 1;     // 위험할 때 하트가 콩닥콩닥
    drawHeart(ctx, 36, 32, 34 * beat, true);
    const fg = ratio > 0.5 ? COLORS.mint : ratio > T.hud.lowHpRatio ? COLORS.yellow : COLORS.red;
    Draw.bar(ctx, 60, 19, 242, 26, ratio, { fg, bg: 'rgba(20,10,30,.72)', border: COLORS.ink, lw: 3 });
    Draw.text(ctx, hp + ' / ' + maxHp, 181, 39, { size: 18, lw: 4 });
    // 목숨
    Draw.text(ctx, '목숨', 24, 78, { size: 18, align: 'left', lw: 4 });
    const maxLives = Game.diff ? Game.diff.lives : 3, lives = Game.lives;
    if (maxLives === Infinity || lives === Infinity) {
      drawHeart(ctx, 100, 71, 26, true); drawInfinity(ctx, 140, 71, 40);
    } else {
      const total = clamp(Math.round(Number(maxLives) || 0), 0, T.hud.maxHearts), have = clamp(Math.round(Number(lives) || 0), 0, total);
      for (let i = 0; i < total; i++) drawHeart(ctx, 100 + i * 30, 71, 26, i < have);
    }
    if (low) Draw.text(ctx, '위험!', 300, 78, { size: 18, align: 'right', color: COLORS.yellow, lw: 4 });
    ctx.restore();
  }

  function hudRoom(ctx, now, calm) {
    const st = Game.stage || {};
    const name = st.roomName || '', n = clamp(Math.round(st.roomCount) || 0, 0, 12);
    if (!name && !n) return;
    ctx.save();
    ctx.font = 'bold 22px ' + CFG.font;
    const nameW = name ? ctx.measureText(name).width : 0, fs = nameW > 210 ? Math.max(14, Math.floor(22 * 210 / nameW)) : 22;   // 이름이 너무 길면 글자를 줄여요 (양옆 판과 겹치지 않게)
    const w = Math.max(180, Math.min(nameW, 210) + 54), x = W / 2 - w / 2;
    Draw.roundRect(ctx, x, 8, w, 34, 17); ctx.fillStyle = 'rgba(43,27,58,.62)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke();
    if (name) Draw.text(ctx, name, W / 2, 25 + fs * 0.36, { size: fs, lw: 4 });
    if (n > 0) {
      const gap = 24, dw = (n - 1) * gap + 40, x0 = W / 2 - (n - 1) * gap / 2, idx = clamp(Math.round(st.roomIndex) || 0, 0, n - 1);
      Draw.roundRect(ctx, W / 2 - dw / 2, 46, dw, 24, 12); ctx.fillStyle = 'rgba(43,27,58,.55)'; ctx.fill();
      for (let i = 0; i < n; i++) {
        const cx = x0 + i * gap, cy = 58;
        ctx.beginPath();
        if (i === idx) {                                                              // 지금 방: 크고 노랗고 테두리가 도드라짐
          const pr = calm ? 0 : Math.sin(now * 0.12) * 0.8;
          ctx.arc(cx, cy, 8.5 + pr, 0, TAU); ctx.fillStyle = COLORS.yellow; ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
        } else if (i < idx) {                                                         // 지나온 방: 꽉 찬 민트
          ctx.arc(cx, cy, 6, 0, TAU); ctx.fillStyle = COLORS.mint; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COLORS.ink; ctx.stroke();
        } else {                                                                      // 앞으로 갈 방: 속이 빈 동그라미
          ctx.arc(cx, cy, 5.5, 0, TAU); ctx.fillStyle = 'rgba(20,10,30,.6)'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COLORS.cream; ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function hudScore(ctx, now, calm) {
    const score = Math.max(0, Number(Game.score) || 0);
    if (score > HUD.lastScore) HUD.scorePop = now;
    if (score < HUD.scoreShown) HUD.scoreShown = score;                                // 새 판이 시작되면 바로 0 으로
    HUD.lastScore = score;
    HUD.scoreShown += (score - HUD.scoreShown) * (calm ? 1 : 0.2);                     // 숫자가 드르륵 올라감
    if (Math.abs(score - HUD.scoreShown) < 1) HUD.scoreShown = score;
    ctx.font = 'bold 34px ' + CFG.font;
    const txt = fmt(HUD.scoreShown), numW = ctx.measureText(txt).width;
    const xr = W - S.hudInset, w = clamp(numW + 92, 214, 290), x = xr - w;                // 점수가 아주 커도 숫자가 판 밖으로 나가지 않게
    ctx.save();
    Draw.roundRect(ctx, x, 8, w, 58, 18); ctx.fillStyle = 'rgba(43,27,58,.62)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke();
    Draw.text(ctx, '점수', x + 16, 45, { size: 18, align: 'left', lw: 4 });
    const age = now - HUD.scorePop, pop = !calm && age >= 0 && age < 9 ? 1 + 0.16 * (1 - age / 9) : 1;
    ctx.translate(x + w - 16, 50); ctx.scale(pop, pop);
    Draw.text(ctx, txt, 0, 0, { size: 34, align: 'right', color: COLORS.yellow, lw: 5 });
    ctx.restore();
  }

  function hudCombo(ctx, now, calm) {
    const c = Game.combo || { count: 0, timer: 0 }, count = c.count | 0;
    const x = W - 28, y = 150;
    const comboColor = n => n >= 20 ? COLORS.pink : n >= 10 ? '#ffb347' : n >= 5 ? COLORS.yellow : '#fff';
    ctx.save();
    if (count >= T.hud.comboMin) {
      const age = now - HUD.comboPop, pop = !calm && age >= 0 && age < 12 ? 1 + 0.5 * Math.pow(1 - age / 12, 2) : 1;
      const size = clamp(30 + count * 1.8, 30, 66) * pop, col = comboColor(count);
      ctx.translate(x, y); if (!calm) ctx.rotate(-0.05);
      const w1 = Draw.text(ctx, 'HIT!', 0, 0, { size: size * 0.5, align: 'right', color: col, lw: 5 });
      const w2 = Draw.text(ctx, String(count), -w1 - 8, 0, { size, align: 'right', color: col, lw: 7 });
      const tw = w1 + w2 + 8, ratio = CFG.comboWindow > 0 ? clamp((c.timer || 0) / CFG.comboWindow, 0, 1) : 0;
      Draw.bar(ctx, -Math.max(120, tw), 12, Math.max(120, tw), 9, ratio, { fg: col, bg: 'rgba(20,10,30,.6)', border: COLORS.ink, lw: 2 });
    } else if (HUD.ghost) {                                                           // 콤보가 끊기면 숫자가 위로 사라짐
      const gAge = now - HUD.ghost.t;
      if (gAge >= 0 && gAge < 28) {
        ctx.globalAlpha = 1 - gAge / 28;
        Draw.text(ctx, HUD.ghost.count + ' HIT', x, y - gAge * 0.6, { size: 30, align: 'right', color: '#ddd', lw: 5 });
      } else HUD.ghost = null;
    }
    ctx.restore();
  }

  // 스킬 상태 계산 (캔버스와 터치 버튼이 같이 씀)
  function skillInfo(sk) {
    const cdMax = Math.max(1, Number(sk && sk.cdMax) || 1), cd = clamp(Number(sk && sk.cd) || 0, 0, cdMax);
    return { cd, cdMax, ratio: cd / cdMax, secs: Math.ceil(cd / 60), ready: cd <= 0 };
  }

  function hudSkills(ctx, p, now, calm) {
    const skills = (p && p.skills) || [];
    const dead = !!(p && p.dead);
    for (let i = 0; i < 3; i++) {
      const def = T.skillDefaults[i], sk = skills[i];
      const info = skillInfo(sk || { cd: 0, cdMax: 1 });
      if (HUD.lastCd[i] > 0 && info.cd <= 0) HUD.readyAt[i] = now;                      // 준비되는 순간 반짝!
      HUD.lastCd[i] = info.cd;
      const s = 62, bx = 18 + i * 74, by = T.hud.skillTop, cx = bx + s / 2, cy = by + s / 2;
      ctx.save();
      if (dead) ctx.globalAlpha = 0.55;
      Draw.roundRect(ctx, bx, by, s, s, 15); ctx.fillStyle = 'rgba(43,27,58,.78)'; ctx.fill();
      ctx.font = '31px ' + CFG.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha *= info.ready ? 1 : 0.6;
      ctx.fillStyle = '#fff'; ctx.fillText((sk && sk.icon) || def.icon, cx, cy + 3);
      ctx.globalAlpha = dead ? 0.55 : 1;
      if (!info.ready) {                                                                // 쿨타임 부채꼴 (맨 위에서 시계 방향으로 걷힘)
        ctx.save(); Draw.roundRect(ctx, bx, by, s, s, 15); ctx.clip();
        ctx.fillStyle = 'rgba(15,8,25,.7)'; ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, s, -Math.PI / 2 + (1 - info.ratio) * TAU, -Math.PI / 2 + TAU); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      Draw.roundRect(ctx, bx, by, s, s, 15);
      ctx.lineWidth = info.ready ? 4 : 3; ctx.strokeStyle = info.ready ? COLORS.yellow : 'rgba(255,244,224,.7)'; ctx.stroke();
      if (info.ready && !dead) {                                                        // 준비됨: 테두리 바깥 은은한 숨쉬기 링 + 반짝이
        const br = calm ? 0.5 : 0.5 + 0.5 * Math.sin(now * 0.1 + i);
        Draw.roundRect(ctx, bx - 3, by - 3, s + 6, s + 6, 18); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,246,168,' + (0.35 + 0.4 * br).toFixed(2) + ')'; ctx.stroke();
        drawSparkle(ctx, bx + s - 6, by + 8, calm ? 9 : 7 + 4 * br, calm ? 0 : now * 0.03, '#fff6a8');
      }
      const fAge = now - HUD.readyAt[i];
      if (!calm && fAge >= 0 && fAge < 20) {                                            // 준비되는 순간 퍼지는 링
        ctx.globalAlpha = 1 - fAge / 20; ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
        Draw.roundRect(ctx, bx - fAge * 0.8, by - fAge * 0.8, s + fAge * 1.6, s + fAge * 1.6, 15 + fAge * 0.5); ctx.stroke();
        ctx.globalAlpha = dead ? 0.55 : 1;
      }
      ctx.restore();
      // 키 이름표 (왼쪽 위 동그라미) + 남은 초
      ctx.save();
      ctx.beginPath(); ctx.arc(bx + 4, by + 5, 14, 0, TAU); ctx.fillStyle = COLORS.ink; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = COLORS.cream; ctx.stroke();
      Draw.text(ctx, (sk && sk.key) || def.key, bx + 4, by + 11, { size: 18, lw: 0 });
      if (!info.ready) Draw.text(ctx, String(info.secs), cx, cy + 10, { size: 28, lw: 5 });
      ctx.restore();
    }
  }

  function hudBoss(ctx, now, calm) {
    const b = Game.boss;
    if (!b || !(b.maxHp > 0)) { HUD.boss = null; return; }
    if (typeof Stage !== 'undefined' && Stage.state === 'intro') return;                 // "보스 등장!" 경고 배너가 떠 있는 동안은 기다렸다가, 싸움이 시작되면 스르륵 내려와요
    if (HUD.boss !== b) { HUD.boss = b; HUD.bossT = now; HUD.bossLag = clamp(b.hp / b.maxHp, 0, 1); }
    const ratio = clamp(b.hp / b.maxHp, 0, 1);
    HUD.bossLag = ratio > HUD.bossLag ? ratio : HUD.bossLag + (ratio - HUD.bossLag) * 0.05;   // 깎인 부분이 천천히 따라 내려옴
    const slide = calm ? 1 : easeOut((now - HUD.bossT) / 24);
    // 아래에서 살짝 올라오며 스르륵 나타나요. (예전엔 위에서 내려왔는데, 그러면 처음 0.3초 동안 점수판·방 이름판 위를 지나가며 겹쳤어요 → 늘 판들 아래(y ≥ bossBarY-40)에만 있게)
    const w = 420, x = (W - w) / 2, y = T.hud.bossBarY + (1 - slide) * 26;
    ctx.save();
    ctx.globalAlpha = slide;
    Draw.roundRect(ctx, x - 14, y - 40, w + 28, 76, 20); ctx.fillStyle = 'rgba(43,27,58,.66)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke();
    Draw.text(ctx, '👑 ' + (b.name || '젤리 대왕'), x + 4, y - 12, { size: 22, align: 'left', lw: 4 });
    Draw.text(ctx, Math.ceil(ratio * 100) + '%', x + w - 4, y - 12, { size: 20, align: 'right', lw: 4 });
    Draw.bar(ctx, x, y, w, 24, HUD.bossLag, { fg: COLORS.yellow, bg: 'rgba(20,10,30,.72)', border: COLORS.ink, lw: 3 });
    Draw.bar(ctx, x, y, w, 24, ratio, { fg: ratio > 0.5 ? COLORS.pink : COLORS.red, bg: 'rgba(0,0,0,0)', border: COLORS.ink, lw: 3 });
    ctx.strokeStyle = COLORS.cream; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + w / 2, y - 3); ctx.lineTo(x + w / 2, y + 27); ctx.stroke();   // 50% 눈금: 화나는 지점
    ctx.restore();
  }

  // 터치 스킬 버튼의 쿨타임 표시 (값이 바뀔 때만 DOM 을 건드려요)
  function syncTouchSkills(p) {
    const btns = S.els.touchSkills;
    if (!btns) return;
    const skills = (p && p.skills) || [];
    for (let i = 0; i < 3; i++) {
      const b = btns[i], sk = skills[i], def = T.skillDefaults[i], info = skillInfo(sk || { cd: 0, cdMax: 1 });
      const key = [info.secs, info.ready ? 1 : 0, Math.round(info.ratio * 100), (sk && sk.icon) || ''].join('|');
      if (HUD.touchSkill[i] === key) continue;
      HUD.touchSkill[i] = key;
      b.root.setAttribute('data-ready', info.ready ? '1' : '0');
      b.root.style.setProperty('--cd', String(Math.round(info.ratio * 100)));
      b.sec.textContent = info.ready ? '' : String(info.secs);
      b.ico.textContent = (sk && sk.icon) || def.icon;
      b.root.setAttribute('aria-label', ((sk && sk.label) || def.label) + ' (' + def.key + ')' + (info.ready ? ', 쓸 수 있어요' : ', ' + info.secs + '초 뒤에 쓸 수 있어요'));
    }
  }

  // HUD 전체: play 씬의 마지막에 stage 가 부름. 플레이어/보스가 없어도, 목숨이 ∞ 여도 안전해야 해요
  function drawHUD(ctx) {
    syncMotion();
    const now = nowF(), calm = reduceMotion(), p = Game.player;
    const bossUp = !!(Game.boss && Game.boss.maxHp > 0);                              // 보스 체력바가 떠 있는 동안엔 토스트를 그 아래로 (UI-08)
    if (S.bossUp !== bossUp && S.els.toasts) { S.bossUp = bossUp; S.els.toasts.classList.toggle('low', bossUp); }
    ctx.save();
    try {
      hudVignette(ctx, p, now, calm);
      hudHp(ctx, p, now, calm);
      hudRoom(ctx, now, calm);
      hudScore(ctx, now, calm);
      hudCombo(ctx, now, calm);
      if (!touchActive()) hudSkills(ctx, p, now, calm);
      hudBoss(ctx, now, calm);
    } finally { ctx.restore(); }
    syncTouchSkills(p);
  }

  // ===== 4. DOM 화면 =====
  const show = (e, on) => { if (e) e.hidden = on === false; };
  const modalOpen = () => !!S.modal;
  const overlayActive = () => Game.scene !== 'play' || !!Game.paused || modalOpen();
  // 터치 컨트롤을 쓸지: 터치 기기이고, (터치 화면 + 키보드가 둘 다 있는 기기에서) 키보드로 플레이 중이 아닐 때.
  // 마우스/터치패드가 기본인 노트북(손가락 대신 포인터가 정밀하고 호버가 되는 기기)은 화면을 실제로 만지기 전까지는 터치 버튼을 숨겨요 (UI-12)
  const finePointer = () => { try { return !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches); } catch (e) { return false; } };
  const touchActive = () => !!Game.touch && !S.kbdUsed && (S.touchSeen || !S.fine);          // (S.fine 은 measure() 가 창 크기가 바뀔 때마다 새로 읽어요 — 프레임마다 물어보지 않게)

  function blurAll() {                                                              // 시작 후 포커스가 버튼에 남아 Space 를 먹지 않게
    try {
      const a = doc.activeElement;
      if (a && a !== doc.body && a.blur && S.els.root && S.els.root.contains(a)) a.blur();
    } catch (e) { /* 무시 */ }
    try { window.focus(); } catch (e) { /* 무시 */ }
  }
  function focusEl(e) { try { if (e && !e.hidden) e.focus({ preventScroll: true }); } catch (err) { /* 무시 */ } }

  // --- 토스트 ---
  function toast(text, ms) {
    const box = S.els.toasts;
    if (!box) return null;
    const life = ms === undefined ? T.toastMs : ms;
    const n = el('div', { class: 'toast', text: String(text) });
    box.append(n);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 340); }, Math.max(200, life));
    return n;
  }

  // --- 소리 켜고 끄기 (KeyM 도 버튼도 모두 여기 한 곳으로) ---
  function updateMuteBtn() {
    const b = S.els.btnMute;
    if (!b) return;
    const m = !!SFX.muted;
    b.textContent = m ? '🔇' : '🔊';
    b.setAttribute('aria-label', '소리 끄기');                                       // 이름은 늘 같게 + 눌림 상태(aria-pressed = 지금 꺼져 있음). (이름이 바뀌면서 눌림도 켜지면 "소리 켜기, 눌림" 처럼 앞뒤가 안 맞게 읽혀요)
    b.setAttribute('aria-pressed', m ? 'true' : 'false');
    b.title = m ? '소리 켜기 (M)' : '소리 끄기 (M)';
    const pm = S.els.pauseMute;
    if (pm) pm.textContent = m ? '🔇 소리 켜기' : '🔊 소리 끄기';
  }
  function toggleMute(withToast) {
    try { SFX.init(); SFX.setMuted(!SFX.muted); } catch (e) { /* 무시 */ }
    updateMuteBtn();
    if (withToast) toast(SFX.muted ? '🔇 소리를 껐어요' : '🔊 소리를 켰어요', 1200);
    return !!SFX.muted;
  }

  // --- 움직임 줄이기 (KIDS-06): 켜면 흔들림·번쩍임·통통 튀는 장식이 조용해져요. 코어의 FX.reduceMotion 을 바꾸고 Store 에 기억해요 ---
  const motionLabel = on => '움직임 줄이기 ' + (on ? '켜짐' : '꺼짐');
  // short: 좁은 칸(일시정지 창의 반쪽 버튼)에서는 글자는 「움직임 줄이기」 만 두고, 켜짐/꺼짐은 아이콘(✨ → ✅)·초록 테두리·aria-pressed 로 알려요
  const makeMotionBtn = (id, onclick, short) => el('button', { class: 'btn btn-small btn-cream motion-btn', type: 'button', id, 'aria-label': '움직임 줄이기', 'aria-pressed': 'false', 'data-on': '0', 'data-short': short ? '1' : '0', onclick },
    el('span', { class: 'ico', 'aria-hidden': 'true', text: '✨' }), el('span', { class: 'lbl', text: short ? '움직임 줄이기' : motionLabel(false) }));
  function syncMotion(force) {                                                      // (값이 바뀌었을 때만 DOM 을 건드려요. OS 설정이 바뀐 것도 여기서 따라가요)
    const calm = reduceMotion();
    if (!force && S.calm === calm) return;
    S.calm = calm;
    docEl.setAttribute('data-calm', calm ? '1' : '0');                              // CSS 애니메이션도 이걸 따라요 (style.html)
    [S.els.motionBtn, S.els.pauseMotion].forEach(b => {
      if (!b) return;
      const l = b.querySelector('.lbl'); if (l && b.getAttribute('data-short') !== '1') l.textContent = motionLabel(calm);
      const ic = b.querySelector('.ico'); if (ic) ic.textContent = calm ? '✅' : '✨';
      b.title = motionLabel(calm);
      b.setAttribute('aria-pressed', calm ? 'true' : 'false');
      b.setAttribute('data-on', calm ? '1' : '0');
    });
  }
  function setReduceMotion(on) {
    on = !!on;
    try { Store.set('reduceMotion', on); } catch (e) { /* 저장은 못 해도 이번 판엔 적용돼요 */ }
    try { FX.reduceMotion = on; } catch (e) { /* 무시 */ }
    syncMotion(true);
    return on;
  }
  function toggleMotion() { return setReduceMotion(!reduceMotion()); }

  // --- 화면 읽어 주기 (UI-11): 눈이 불편한 친구를 위해 방이 바뀔 때·체력이 위험할 때만 짧게 알려요. 캔버스 그림은 읽을 수 없어서요 ---
  function announce(text) {
    const l = S.els.live;
    if (!l || !text) return;
    S.liveFlip = !S.liveFlip;
    l.textContent = text + (S.liveFlip ? '' : '\u200b');                            // (같은 말을 또 해도 다시 읽히게 보이지 않는 글자를 번갈아 붙여요)
  }

  // --- 모달(조작법 / 랭킹) 열고 닫기 ---
  function openModal(name) {
    if (S.modal && S.modal !== name) closeModal(S.modal, true);
    const m = S.els[name + 'Modal'];
    if (!m) return;
    if (!S.modal) S.returnFocus = doc.activeElement;
    S.modal = name; show(m);
    focusEl(m.querySelector('[data-first]') || m.querySelector('button'));
  }
  function closeModal(name, keepFocus) {
    const m = S.els[name + 'Modal'];
    if (!m || S.modal !== name) return;
    show(m, false); S.modal = null;
    if (!keepFocus) { const f = S.returnFocus; S.returnFocus = null; if (f && f.focus && doc.contains(f) && !f.hidden) focusEl(f); }
  }

  // --- 랭킹 목록 (결과 화면과 랭킹 모달이 같이 씀) ---
  //   쉬움/보통/어려움 탭마다 따로 보여줘요 (KIDS-09: 목숨이 많은 쉬움이 어려움을 눌러 이기면 안 되니까).
  //   서버 랭킹을 못 불러와서 이 기기의 기록을 보여줄 땐 솔직하게 알려요 (GAS-07).
  const RANK_FAIL = '랭킹을 불러올 수 없어요. 조금 있다가 다시 봐요!';
  function makeRankView() {
    const keys = Object.keys(CFG.difficulty);
    const tabs = el('div', { class: 'rank-tabs', role: 'tablist', 'aria-label': '난이도별 랭킹' });
    const tabBtns = keys.map(key => {
      const b = el('button', { class: 'rank-tab', type: 'button', role: 'tab', 'data-diff': key, 'aria-selected': 'false', tabindex: '-1', text: CFG.difficulty[key].label, onclick: () => { sfx('ui'); view.touched = true; view.load(key); } });
      tabs.append(b);
      return b;
    });
    const note = el('p', { class: 'rank-note', role: 'status', hidden: true });
    const list = el('ol', { class: 'rank-list', 'aria-label': '랭킹 TOP ' + T.rankTop });
    const status = el('p', { class: 'rank-status', role: 'status' });
    let token = 0, cur = CFG.difficulty.normal ? 'normal' : keys[0];
    const myNick = () => Game.nickname || Store.get('nickname', '');
    function setTab(key) {
      if (!CFG.difficulty[key]) return;
      cur = key;
      tabBtns.forEach(b => { const on = b.getAttribute('data-diff') === key; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
    }
    function render(rows) {
      list.textContent = '';
      note.hidden = !(rows && rows.source === 'local');                              // 서버 대신 이 기기의 기록이면 정직하게 알려요
      note.textContent = note.hidden ? '' : '📱 이 기기에서 한 기록만 보여요';
      if (!Array.isArray(rows) || !rows.length) { status.textContent = '아직 기록이 없어요. 첫 번째 주인공이 되어 봐요!'; return; }
      status.textContent = '';
      const me = myNick();
      rows.slice(0, T.rankTop).forEach((r, i) => {
        r = r || {};
        const rank = Number(r.rank) || i + 1, nick = String(r.nickname === undefined ? '?' : r.nickname);
        const stars = clamp(Math.round(Number(r.stars) || 0), 0, 3);
        const d = CFG.difficulty[r.difficulty];
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : String(rank);
        const isMe = !!me && nick === me;
        list.append(el('li', { class: 'rank-row' + (isMe ? ' me' : ''), 'data-rank': rank, 'data-me': isMe ? '1' : '0' },
          el('span', { class: 'rank-no', text: medal, 'aria-label': rank + '등' }),
          el('span', { class: 'rank-name' }, isMe ? el('span', { class: 'rank-me-tag', text: '나' }) : null, el('span', { class: 'rank-nick', text: nick }), d ? el('span', { class: 'rank-diff', text: d.label }) : null),
          el('span', { class: 'rank-stars', text: '★'.repeat(stars) + '☆'.repeat(3 - stars), role: 'img', 'aria-label': '별 ' + stars + '개' }),
          el('span', { class: 'rank-score', text: fmt(r.score) })));
      });
    }
    function reset(key) {                                                            // 이전 판의 랭킹이 남아 있지 않게 비우고 "불러오는 중" 으로 (UI-07)
      token++; view.touched = false;
      list.textContent = ''; note.hidden = true; note.textContent = ''; status.textContent = '랭킹을 불러오는 중…';
      if (key) setTab(key);
    }
    function load(key) {                                                             // key 를 주면 그 난이도 탭으로 바꿔서, 안 주면 지금 탭을 다시
      if (key) setTab(key);
      const my = ++token, diff = cur;
      list.textContent = ''; note.hidden = true; note.textContent = ''; status.textContent = '랭킹을 불러오는 중…';
      let p = null;
      try { if (hasFn(Server, 'getTopScores')) p = Server.getTopScores(T.rankTop, diff); } catch (e) { p = null; }
      if (!p || typeof p.then !== 'function') { status.textContent = RANK_FAIL; return; }
      p.then(rows => { if (my === token) render(rows); }, () => { if (my === token) status.textContent = RANK_FAIL; });
    }
    const view = { tabs, note, list, status, tabBtns, render, load, reset, select: setTab, tab: () => cur, touched: false, cancel() { token++; } };
    setTab(cur);
    return view;
  }

  // --- 닉네임 검사: 서버 모듈이 있으면 그걸, 없으면 간단한 검사 ---
  //   (칸 이름이 "별명" 이라서, 서버가 돌려준 문구의 '이름' 도 화면에 보여줄 때 '별명' 으로 바꿔요. 받침이 같아서 조사(은/는/을/를)는 그대로 맞아요. UI.validateNickname 이 돌려주는 값은 서버 결과 그대로예요)
  const niceNickError = msg => String(msg).replace(/이름/g, '별명');
  const NICK_EMPTY = '별명을 적어 주세요! (' + T.nick.min + '~' + T.nick.max + '글자, 🎲 를 눌러도 돼요)';
  function validateNick(raw) {
    const s = String(raw === undefined || raw === null ? '' : raw);
    if (!s.trim()) return { ok: false, error: NICK_EMPTY };                          // 비어 있으면 주사위를 알려줘요
    if (hasFn(Server, 'validateNickname')) {
      const r = safe(() => Server.validateNickname(s));
      if (r && typeof r.ok === 'boolean') return r.ok ? { ok: true, value: String(r.value === undefined ? s.trim() : r.value) } : { ok: false, error: String(r.error || '이름을 다시 적어 주세요') };
    }
    const v = s.replace(/\s+/g, ' ').trim(), len = Array.from(v).length;
    if (len < T.nick.min) return { ok: false, error: '별명은 ' + T.nick.min + '~' + T.nick.max + '글자로 적어 주세요' };
    if (len > T.nick.max) return { ok: false, error: '별명은 ' + T.nick.max + '글자까지만 쓸 수 있어요' };
    if (!/^[0-9A-Za-zㄱ-ㅣ가-힣 ]+$/.test(v)) return { ok: false, error: '한글, 영어, 숫자만 쓸 수 있어요' };
    return { ok: true, value: v };
  }
  // 주사위: 귀여운 별명 하나 만들어 주기 (서버 모듈의 안전한 이름 만들기. 서버가 없으면 아주 작은 대체)
  function makeNick() {
    let n = '';
    try { if (hasFn(Server, 'randomNickname')) n = String(Server.randomNickname() || ''); } catch (e) { n = ''; }
    if (n && validateNick(n).ok) return n;
    const adj = ['말랑', '폭신', '반짝', '통통'], noun = ['젤리', '사탕', '구름', '토끼'], f = () => RNG.fx();    // (게임 난수는 건드리지 않게 연출 난수로)
    return adj[Math.floor(f() * adj.length)] + noun[Math.floor(f() * noun.length)] + (10 + Math.floor(f() * 90));
  }
  function fillNick(auto) {
    const e = S.els;
    e.nick.value = makeNick(); S.nickAuto = !!auto;
    showNickError('');
  }
  function showNickError(msg) {
    const e = S.els;
    e.nickErr.textContent = msg || '';
    e.nick.setAttribute('aria-invalid', msg ? 'true' : 'false');
    e.nickErr.classList.remove('shake');
    if (msg) { void e.nickErr.offsetWidth; e.nickErr.classList.add('shake'); }
  }

  // --- 난이도 카드 ---
  function selectDiff(key, focus) {
    if (!CFG.difficulty[key]) return;
    S.diff = key;
    S.els.diffCards.forEach(c => {
      const on = c.getAttribute('data-diff') === key;
      c.setAttribute('aria-checked', on ? 'true' : 'false'); c.tabIndex = on ? 0 : -1;
      if (on && focus) focusEl(c);
    });
  }

  // --- 게임 시작 / 다시 / 처음으로 ---
  function startGame() {
    if (Game.scene !== 'title' || S.starting) return false;
    const r = validateNick(S.els.nick.value);
    if (!r.ok) { showNickError(niceNickError(r.error)); focusEl(S.els.nick); sfx('ui'); return false; }
    showNickError('');
    S.els.nick.value = r.value;
    Store.set('nickname', r.value); Store.set('difficulty', S.diff);
    Game.nickname = r.value;
    if (!hasFn(Stage, 'start')) { toast('아직 준비 중이에요. 조금만 기다려 줘요!', 3000); return false; }
    S.starting = true;
    try { SFX.init(); sfx('go'); Music.play('stage'); } catch (e) { /* 소리는 없어도 돼요 */ }
    try { Stage.start({ difficulty: S.diff, nickname: r.value }); }
    catch (e) { S.starting = false; Debug.logOnce('UI.startGame', e); toast('앗, 시작하지 못했어요. 다시 눌러 줘요!', 3000); try { Music.play('title'); } catch (e2) { /* 무시 */ } return false; }
    S.starting = false;
    blurAll();
    return true;
  }
  function restartRun() {                                                           // 같은 난이도·닉네임으로 처음부터
    const nick = Game.nickname || Store.get('nickname', '용사');
    const diff = (Game.result && Game.result.difficulty) || Game.difficulty;
    if (Game.paused) Game.pause(false);
    try { SFX.init(); Music.play('stage'); } catch (e) { /* 무시 */ }
    if (hasFn(Stage, 'start')) safe(() => Stage.start({ difficulty: CFG.difficulty[diff] ? diff : Game.difficulty, nickname: nick }));
    blurAll();
  }
  function toTitle() {
    if (Game.paused) Game.pause(false);
    safe(() => { Entities.clear(); FX.clear(); });
    if (hasFn(Enemies, 'clear')) safe(() => Enemies.clear());
    try { Music.play('title'); } catch (e) { /* 무시 */ }
    Game.setScene('title');
  }
  function resume() { if (Game.paused && !S.portrait) Game.pause(false); }          // "가로로 돌려 주세요" 가 떠 있는 동안은 계속하지 않아요 (안 보이는 채로 게임이 흘러가면 안 되니까)

  // --- 일시정지 오버레이의 "한 번 더 누르세요" (실수로 눌러 기록을 잃지 않게) ---
  function armConfirm(btn, label, action) {
    if (S.confirm && S.confirm.btn === btn) {
      if (performance.now() - S.confirm.t0 < T.confirmGuardMs) return;               // 더블클릭·더블탭·Enter 꾹 누름은 "한 번 더" 로 치지 않아요 (그대로 확인 상태 유지)
      const a = S.confirm.action; disarmConfirm(); a(); return;
    }
    disarmConfirm();
    const old = btn.textContent;
    btn.textContent = '정말요? 한 번 더 눌러요!';

  // 별 모양 SVG (속이 빈 별 → 켜지면 노랗게 꽉 참)
  function starPoints(ro, ri) {
    const pts = [];
    for (let i = 0; i < 10; i++) { const r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / 5; pts.push((Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r).toFixed(1)); }
    return pts.join(' ');
  }
  function makeStarEl() {
    const NS = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs) => { const n = doc.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
    const svg = mk('svg', { viewBox: '-58 -58 116 116', 'aria-hidden': 'true', focusable: 'false' });
    svg.append(mk('polygon', { class: 's-back', points: starPoints(50, 26) }), mk('polygon', { class: 's-fill', points: starPoints(36, 19) }),
      mk('ellipse', { class: 's-shine', cx: '-15', cy: '-17', rx: '6', ry: '10', transform: 'rotate(-35 -15 -17)', fill: '#fff' }));
    return el('span', { class: 'star' }, svg);
  }

  // 저장 상태 문구 (저장 중 → 저장됨 / 내 기기에만 / 실패)
  //   saving / saved
  //   local  : 내 기기에만 저장됨. 서버가 없는 환경이거나 서버가 기록을 받지 않았으면 그걸로 끝 (다시 보내도 소용없으니 버튼 없음).
  //            서버에 못 올렸을 때(느림·점검·잠깐 바쁨…)는 data-retry="1" 로 「다시 보내기」 버튼과 "다시 보내 볼까요?" 가 같이 나와요 (GAS-03)
  //   failed : 저장하지 못했어요 (별명이 잘못됐거나 응답이 너무 늦음) → 「다시 보내기」
  const SAVE_TEXT = {
    saving: '⏳ 저장 중…', saved: '✅ 저장됐어요!', local: '📱 내 기기에만 저장됐어요', failed: '⚠️ 저장 실패 — 다시 시도해 봐요',
  };
  const SAVE_MORE = ' 다시 보내 볼까요?';                                           // 'local' 에서 다시 보낼 수 있을 때 문구 뒤에 붙는 말 (낮은 화면에서는 CSS 가 접어요)
  function setSave(state, retry) {
    S.saveState = state;
    const e = S.els, again = state === 'failed' || (state === 'local' && !!retry);
    e.save.setAttribute('data-state', state);
    e.save.setAttribute('data-retry', again ? '1' : '0');
    e.saveText.textContent = SAVE_TEXT[state] || '';
    if (state === 'local' && again) e.saveText.append(el('span', { class: 'save-more', text: SAVE_MORE }));
    e.retry.hidden = !again;
  }
  // 서버 응답 → 저장 상태 (Server.saveScore 는 reject 하지 않고 { ok, source, warning, retryable } 로 알려줘요)
  function saveStateOf(r) {
    if (!r || r.ok === false) return { state: 'failed' };
    if (r.source !== 'local') return { state: 'saved' };
    return { state: 'local', retry: r.warning === 'server_failed' && r.retryable !== false };
  }
  function startSave(res) {
    const token = ++S.saveToken;
    setSave('saving');
    let done = false, timer = 0;
    const finish = (state, retry) => {
      if (token !== S.saveToken || done) return;
      done = true; clearTimeout(timer);
      setSave(state, retry);
      S.els.resRank.load();                                                         // 저장이 끝나면(성공이든 실패든) 랭킹을 보여줘요 (이번 판 난이도 탭, 친구가 다른 탭을 골랐으면 그 탭)
    };
    timer = setTimeout(() => finish('failed'), T.saveTimeoutMs);
    const payload = {
      nickname: Game.nickname || Store.get('nickname', ''), score: Math.max(0, Math.round(Number(res.score) || 0)),
      stageId: String(res.stageId || ''), difficulty: String(res.difficulty || Game.difficulty),
      stars: clamp(Math.round(Number(res.stars) || 0), 0, 3), cleared: !!res.cleared, timeSec: Math.max(0, Math.round((Number(res.timeFrames) || 0) / 60)),
    };
    let p = null;
    try { if (hasFn(Server, 'saveScore')) p = Server.saveScore(payload); } catch (e) { p = null; }
    if (!p || typeof p.then !== 'function') { finish('failed'); return; }
    p.then(r => { const o = saveStateOf(r); finish(o.state, o.retry); }, () => finish('failed'));
  }

  // ===== 5. 터치 컨트롤 =====
  function buildTouch() {
    const root = S.els.touchRoot;
    const knob = el('div', { class: 'tc-knob' }), base = el('div', { class: 'tc-base' }, knob);
    const zone = el('div', { class: 'tc-stick', 'data-role': 'stick', role: 'group', 'aria-label': '움직이기 조이스틱' }, base);
    const held = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
    let pid = null;
    // 방향키 누르기/떼기. 누를 땐 우리가 기억하는 값(held)뿐 아니라 "진짜 Input 상태"와도 맞춰 봐요:
    // 일시정지·창 이동·장면 전환으로 Input.clear() 가 불리면 키는 풀렸는데 held 만 true 로 남아서, 손가락이 그대로여도 영영 안 움직이던 문제(R-09)
    // (뗄 땐 우리가 누른 것만 떼요 — 키보드로 누르고 있는 방향키를 스틱이 대신 풀어 버리면 안 되니까)
    const setDir = (code, on) => {
      if (on) {
        if (held[code] && Input.isDown(code)) return;
        held[code] = true;
        if (!Input.isDown(code)) Input.press(code);
      } else {
        if (!held[code]) return;
        held[code] = false; Input.release(code);
      }
    };
    function stickMove(e) {
      const r = base.getBoundingClientRect(), R = Math.max(1, r.width / 2);
      const dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + r.height / 2);
      const len = Math.hypot(dx, dy), lim = R * 0.92, k = len > lim ? lim / len : 1;
      knob.style.transform = 'translate(' + (dx * k).toFixed(1) + 'px,' + (dy * k).toFixed(1) + 'px)';
      const nx = dx / R, ny = dy / R, on = T.touch.stickOn, off = T.touch.stickOff;
      setDir('ArrowLeft', held.ArrowLeft ? nx < -off : nx < -on);                    // 누를 땐 크게, 뗄 땐 작게 (경계에서 깜빡이지 않게)
      setDir('ArrowRight', held.ArrowRight ? nx > off : nx > on);
      setDir('ArrowUp', held.ArrowUp ? ny < -off : ny < -on);
      setDir('ArrowDown', held.ArrowDown ? ny > off : ny > on);
    }
    function stickEnd() {
      pid = null; zone.classList.remove('held'); knob.style.transform = '';
      for (const c in held) setDir(c, false);
    }
    zone.addEventListener('pointerdown', e => {
      if (pid !== null) return;                                                      // 조이스틱은 손가락 하나만
      if (e.cancelable) e.preventDefault();
      pid = e.pointerId; zone.classList.add('held');
      try { zone.setPointerCapture(e.pointerId); } catch (err) { /* 가짜 포인터 등 */ }
      stickMove(e);
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId === pid) { stickMove(e); return; }
      // 일시정지 화면을 닫았을 때 손가락이 아직 스틱 위에 있으면, 새 pointerdown 이 없어도 그 손가락을 다시 이어받아요 (움직이는 터치만. 마우스는 누르고 있을 때만)
      if (pid === null && (e.pointerType === 'touch' || (e.buttons & 1))) {
        pid = e.pointerId; zone.classList.add('held');
        try { zone.setPointerCapture(e.pointerId); } catch (err) { /* 가짜 포인터 등 */ }
        stickMove(e);
      }
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => zone.addEventListener(n, e => { if (e.pointerId === pid) stickEnd(); }));
    zone.addEventListener('contextmenu', e => e.preventDefault());

    const mkBtn = (cls, code, ico, txt, label) => {
      const sec = el('span', { class: 'tc-sec' }), cd = el('span', { class: 'tc-cd' });
      const b = el('button', { class: 'tc-btn ' + cls, type: 'button', 'data-key': code, 'aria-label': label },
        el('span', { class: 'tc-ico', text: ico }), txt ? el('span', { class: 'tc-txt', text: txt }) : null);
      Input.bindButton(b, code);
      return { root: b, ico: b.querySelector('.tc-ico'), sec, cd };
    };
    const atk = mkBtn('tc-atk', 'KeyZ', '⚔️', '공격', '공격 (Z)');
    const jump = mkBtn('tc-jump', 'KeyX', '⬆️', '점프', '점프 (X)');
    const skills = T.skillDefaults.map(d => {
      const b = mkBtn('tc-skill', d.code, d.icon, '', d.label + ' (' + d.key + ')');
      b.root.setAttribute('data-ready', '1');
      b.root.append(b.cd, el('span', { class: 'tc-key', text: d.key }), b.sec);
      return b;
    });
    const btns = el('div', { class: 'tc-btns' }, skills[0].root, skills[1].root, skills[2].root, jump.root, atk.root);

  function releaseTouch() {
    try { if (S.els.stickEnd) S.els.stickEnd(); } catch (e) { /* 무시 */ }

  }

  // ===== 화면 맞추기: --u 계산, 세로 화면 안내, 터치 컨트롤/일시정지 오버레이 보이기 =====
  function measure() {
    const cv = $('game'), r = cv ? cv.getBoundingClientRect() : null;
    const w = r && r.width > 0 ? r.width : Math.min(window.innerWidth, window.innerHeight * 16 / 9);
    S.u = Math.max(0.2, w / W);
    docEl.style.setProperty('--u', S.u.toFixed(4) + 'px');
    S.fine = finePointer();
    let coarse = false;
    try { coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); } catch (e) { coarse = false; }
    const portrait = window.innerHeight > window.innerWidth && (window.innerWidth < 700 || coarse || !!Game.touch);
    docEl.setAttribute('data-portrait', portrait ? '1' : '0');
    const was = S.portrait;
    S.portrait = portrait;
    if (portrait && !was && Game.scene === 'play' && !Game.paused) Game.pause(true);      // 세로로 돌려진 동안 게임이 몰래 진행되지 않게 (이미 세로인 채로 시작한 판은 syncChrome 이 멈춰요)
    syncChrome();
  }
  // HUD 점수판이 오른쪽 위 버튼(일시정지/소리)과 겹치지 않게 비켜 줄 폭 (논리 단위)
  function updateInset() {
    const hb = S.els.hudBtns, cv = $('game');
    if (!hb || !cv) return;
    const r = cv.getBoundingClientRect(), br = hb.getBoundingClientRect();
    if (r.width > 0 && br.width > 0) S.hudInset = clamp((r.right - br.left) / S.u + 8, 60, 220);
  }

  function syncChrome() {
    const e = S.els;
    if (!e.root) return;
    const scene = Game.scene;
    // "가로로 돌려 주세요" 가 떠 있는 동안에는 play 가 진행되면 안 돼요 (GP-1 / UI-03: 세로 창에서 Enter 로 시작하거나 「다시 하기」를 눌러도 안 보이는 채로 게임이 흘러가 목숨을 잃었어요).
    // 장면이 바뀔 때·멈춤이 풀릴 때·크기가 바뀔 때마다 여기를 지나가니까, 어떤 길로 play 에 들어오든 한 줄로 막혀요. (Game.pause 가 다시 이 함수를 부르지만 이번엔 paused 라서 그대로 이어져요)
    if (S.portrait && scene === 'play' && !Game.paused) { Game.pause(true); return; }
    syncMotion();
    e.btnPause.hidden = scene !== 'play';
    updateMuteBtn();
    updateInset();
    // 일시정지 오버레이
    const showPause = scene === 'play' && !!Game.paused;
    if (e.pauseModal.hidden === showPause) {
      show(e.pauseModal, showPause);
      if (showPause) { S.returnFocus = null; focusEl(e.resumeBtn); }
      else { disarmConfirm(); blurIn(e.pauseModal); }
    }
    // 터치 컨트롤: 터치 기기 + 플레이 중 + 일시정지 아님 + 가로 화면
    const on = touchActive() && scene === 'play' && !Game.paused && !S.portrait;
    if (e.touchRoot.classList.contains('on') !== on) { e.touchRoot.classList.toggle('on', on); if (!on) releaseTouch(); }
  }
  function blurIn(container) { try { const a = doc.activeElement; if (a && container.contains(a)) a.blur(); } catch (err) { /* 무시 */ } }

  // ===== 6. 씬 =====
  // ---- 타이틀 ----
  const JELLY_COLORS = [COLORS.pink, COLORS.mint, COLORS.sky, COLORS.yellow, COLORS.purple];

  function drawTitleBG(ctx, t, calm) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);

    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    glow.addColorStop(0, 'rgba(255,255,255,.75)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    // 구름

    // 가까운 언덕

      const b = calm ? { lift: 0, sx: 1, sy: 1 } : bounce(t, 58, 34, ph);
      ctx.fillStyle = 'rgba(43,27,58,.16)'; ctx.beginPath(); ctx.ellipse(x, 486, r * (0.95 - b.lift * 0.004), r * 0.22, 0, 0, TAU); ctx.fill();
      drawJelly(ctx, x, 486 - b.lift, r, c, { sx: b.sx, sy: b.sy, mood, look: calm ? 0 : Math.sin(t * 0.05 + i), tilt: calm ? 0 : Math.sin(t * 0.07 + i) * 0.05 });
    });
    // 반짝이
    for (let i = 0; i < 12; i++) {
      const tw = calm ? 0.8 : 0.5 + 0.5 * Math.sin(t * 0.06 + i * 2.1);
      if (tw > 0.2) drawSparkle(ctx, (i * 157 + 40) % W, 30 + (i * 83) % 330, 4 + tw * 7, calm ? 0 : t * 0.02 + i, i % 2 ? '#fff' : '#fff6a8');

  function drawTitleLogo(ctx, t, calm) {
    const word = CFG.title || '젤리 던전', size = 96;
    const pal = [[COLORS.pink, '#ffc2ee'], [COLORS.yellow, '#fff0a0'], [COLORS.mint, '#c4f5cf'], [COLORS.sky, '#c2efff'], [COLORS.purple, '#c9b3ff']];
    ctx.save();
    ctx.translate(W / 2, 112);
    if (!calm) ctx.rotate(Math.sin(t * 0.03) * 0.028);
    ctx.font = 'bold ' + size + 'px ' + CFG.font;
    const chars = Array.from(word), widths = chars.map(c => ctx.measureText(c).width + (c === ' ' ? 8 : 4));
    const total = widths.reduce((a, b) => a + b, 0);
    let x = -total / 2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round'; ctx.miterLimit = 2;
    chars.forEach((c, i) => {
      const cx = x + widths[i] / 2; x += widths[i];
      if (c === ' ') return;
      const bob = calm ? 0 : Math.sin(t * 0.07 + i * 0.9) * 6, y = bob;
      const [c1, c2] = pal[i % pal.length];
      ctx.lineWidth = size * 0.15; ctx.strokeStyle = COLORS.ink; ctx.strokeText(c, cx, y + 7);                 // 아래 그림자 겸 굵은 윤곽
      ctx.strokeText(c, cx, y);
      ctx.lineWidth = size * 0.065; ctx.strokeStyle = '#fff'; ctx.strokeText(c, cx, y);                        // 스티커 같은 흰 테두리 (한글 속 빈 공간이 메워지지 않게 얇게)
      const g = ctx.createLinearGradient(0, y - size * 0.75, 0, y);
      g.addColorStop(0, c2); g.addColorStop(1, c1);
      ctx.fillStyle = g; ctx.fillText(c, cx, y);
    });
    ctx.restore();
    // 부제 리본
    ctx.save();
    ctx.font = 'bold 24px ' + CFG.font;
    const sub = '귀여운 젤리 용사의 대모험!', sw = ctx.measureText(sub).width + 46, sy = 141;
    Draw.roundRect(ctx, W / 2 - sw / 2, sy, sw, 32, 16); ctx.fillStyle = COLORS.cream; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = COLORS.ink; ctx.stroke();

    ctx.restore();
  }

  // 타이틀이 열릴 때 포커스: 손가락만 쓰는 기기(폰/태블릿)에선 키보드가 불쑥 뜨지 않게 아무 데도 안 줘요 (그래도 키보드를 연결했다면 Enter 로 시작할 수 있어요 — 위 keydown 처리).

  function focusTitle() {
    const e = S.els;
    if (Game.touch && (S.lastPointer === 'touch' || !S.fine)) return;
    if (S.nickAuto) { focusEl(e.nick); try { e.nick.select(); } catch (err) { /* 무시 */ } }
    else focusEl(e.nick.value.trim() ? e.startBtn : e.nick);

      if (remembered) { e.nick.value = remembered; S.nickAuto = false; }
      else fillNick(true);                                                          // 처음이면 별명을 하나 만들어 줘요: 글자를 안 쳐도 바로 「시작!」 (KIDS-08)
      const saved = Game.nickname ? Game.difficulty : Store.get('difficulty', 'normal');   // 한 판 하고 돌아왔으면 방금 난이도, 처음이면 마지막으로 고른 난이도

  // ---- 결과 ----
  function defaultResult() { return { cleared: false, score: Game.score || 0, stars: 0, timeFrames: Game.frame || 0, kills: Game.kills || 0, deaths: Game.deaths || 0, maxCombo: (Game.combo && Game.combo.max) || 0, difficulty: Game.difficulty, stageId: '', stageName: '', rooms: 0 }; }
  // 게임 오버 문구는 "어디까지 왔는지" 로 골라요 (KIDS-13): 처음 방에서 쓰러졌는데 "거의 다 왔어요!" 라고 하면 이상하니까.
  //   res.rooms = 깨고 온 방 수, 전체 방 수 = Game.stage.roomCount (맨 마지막 방이 대왕의 방). 몇 방인지 모르면 가운데 문구.
  function overMsgsFor(res) {
    const done = Math.max(0, Number(res.rooms) || 0), total = Math.max(0, Number(res.roomCount) || Number(Game.stage && Game.stage.roomCount) || 0);
    const g = T.overGroups;
    if (total >= 2 && done >= total - 1) return g.boss;
    if (done <= 1) return g.early;
    return g.mid;
  }
  function fillResult(res) {
    const e = S.els, d = CFG.difficulty[res.difficulty] || Game.diff;
    const stars = clamp(Math.round(Number(res.stars) || 0), 0, 3);
    e.resTitle.textContent = res.cleared ? '스테이지 클리어!' : '아쉬워요!';
    e.resSub.textContent = (res.stageName ? res.stageName + ' · ' : '') + (d ? d.label : '');
    const msgs = res.cleared ? (T.clearMsgs[stars] || T.clearMsgs[1]) : overMsgsFor(res);
    const idx = Math.abs(Math.round((Number(res.score) || 0) / 10) + (res.kills | 0) + (res.deaths | 0)) % msgs.length;
    e.resMsg.textContent = msgs[idx];
    e.resStats.textContent = '';
    const rows = [['물리친 몬스터', (res.kills | 0) + '마리'], ['최고 콤보', (res.maxCombo | 0) + ' HIT'], ['걸린 시간', clock(res.timeFrames)], ['쓰러진 횟수', (res.deaths | 0) + '번']];
    if (res.rooms !== undefined && res.rooms !== null) rows.push(['지나온 방', (res.rooms | 0) + '개']);
    rows.forEach(([k, v]) => e.resStats.append(el('li', null, el('span', { class: 'stat-k', text: k }), el('b', { text: v }))));
    e.resBadge.hidden = !(res.cleared && !(res.deaths | 0));                          // 한 번도 안 쓰러지고 클리어하면 뱃지
    e.resTotal.textContent = '0';
    const kids = e.resStars.children;
    for (let i = 0; i < kids.length; i++) kids[i].classList.remove('on');
    e.resStars.setAttribute('data-total', String(stars)); e.resStars.setAttribute('data-shown', '0');
    e.resStars.setAttribute('aria-label', '별 3개 중 ' + stars + '개');
    return stars;
  }
  function popStar(i) {
    const e = S.els, node = e.resStars.children[i];
    if (!node) return;

      FX.burst((r.left + r.width / 2 - cv.left) / u, (r.top + r.height / 2 - cv.top) / u, { kind: 'ring', count: 1, size: 50, life: 22 });
    } catch (err) { /* 입자는 없어도 돼요 */ }
  }

  function drawResultBG(ctx, t, cleared, calm) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (cleared) { g.addColorStop(0, '#ffe58a'); g.addColorStop(0.55, '#ffc2ee'); g.addColorStop(1, '#b9e7ff'); }
    else { g.addColorStop(0, '#7b6bb5'); g.addColorStop(0.55, '#c79be0'); g.addColorStop(1, '#ffd0e6'); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save(); ctx.translate(W * 0.27, 170); if (!calm) ctx.rotate(t * 0.0035);
    ctx.fillStyle = cleared ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.1)';
    for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -70); ctx.lineTo(900, 70); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    // 반짝이 (게임 오버에서는 별빛처럼 더 작고 조용하게)
    for (let i = 0; i < 16; i++) {

      if (tw > 0.25) drawSparkle(ctx, (i * 131 + 30) % W, 24 + (i * 71) % 460, (cleared ? 4 : 3) + tw * 6, calm ? 0 : t * 0.015 + i, i % 2 ? '#fff' : '#fff6a8');
    }

    ctx.fillStyle = cleared ? '#8fe3a2' : '#9d86c9'; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 486 + Math.sin(x * 0.012 + 2) * 14);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // 꽃가루(사탕/막대사탕) — 클리어에서만 떨어짐
    if (cleared) {
      for (let i = 0; i < 16; i++) {
        const sp = 0.7 + (i % 5) * 0.22, x = (i * 67 + Math.sin(t * 0.02 + i) * 24 + 40) % W, y = calm ? (i * 61) % H : ((t * sp + i * 83) % (H + 80)) - 40;
        const c1 = JELLY_COLORS[i % 5], c2 = JELLY_COLORS[(i + 2) % 5], rot = calm ? i : t * 0.04 * (i % 2 ? -1 : 1) + i;
        if (i % 3 === 0) drawLolli(ctx, x, y, 8, rot * 0.3, c1, '#fff'); else if (i % 3 === 1) drawCandy(ctx, x, y, 8, rot, c1, c2); else drawSparkle(ctx, x, y, 8, rot, '#fff6a8');

    drawJelly(ctx, 26, 524 - b1.lift, 30, COLORS.mint, { sx: b1.sx, sy: b1.sy, mood: cleared ? 'cheer' : 'happy' });
    drawJelly(ctx, 934, 524 - b2.lift, 28, COLORS.pink, { sx: b2.sx, sy: b2.sy, mood: cleared ? 'cheer' : 'happy' });
  }

  Scenes.result = {
    enter() {
      if (Game.paused) Game.pause(false);
      const res = Game.result || defaultResult(), e = S.els;
      S.res = { data: res, f: 0, shown: 0, total: 0, score: Math.max(0, Math.round(Number(res.score) || 0)), cleared: !!res.cleared, lastText: '0', t0: performance.now() };
      S.res.total = fillResult(res);

      e.resRank.reset(CFG.difficulty[res.difficulty] ? res.difficulty : Game.difficulty);   // 지난 판의 랭킹/「나」 표시가 새 점수 옆에 남지 않게 비우고, 이번에 한 난이도 탭을 먼저 보여줘요

      syncChrome();
      if (!res.cleared) sfx('gameover');                                            // (클리어 팡파르는 stage 가 "CLEAR!" 배너에서 이미 울려요 — 겹치지 않게)
      try { Music.play('title'); } catch (err) { /* 무시 */ }
      startSave(res);
      focusEl(e.againBtn);
    },
    exit() {
      const e = S.els;
      S.saveToken++; if (e.resRank) e.resRank.cancel();
      show(e.result, false);
      blurIn(e.result);
    },
    update() {
      const r = S.res;
      if (!r) return;
      r.f++; S.t++;
      const cf = T.result.countFrames, p = r.f >= cf ? 1 : easeOut(r.f / cf);
      const txt = fmt(Math.round(r.score * p));
      if (txt !== r.lastText) { r.lastText = txt; S.els.resTotal.textContent = txt; }
      for (let i = 0; i < r.total; i++) if (r.f === T.result.startDelay + i * T.result.starGap) popStar(i);
      if (r.cleared && r.total > 0 && r.f === T.result.startDelay + (r.total - 1) * T.result.starGap + 14) {   // 마지막 별 뒤에 사탕 폭죽
        try { FX.burst(W * 0.27, 170, { kind: 'candy', count: 18, speed: 7, life: 60 }); } catch (err) { /* 무시 */ }
      }
      try { FX.update(); } catch (err) { /* 무시 */ }
    },
    draw(ctx) {
      syncMotion();
      const calm = reduceMotion(), r = S.res, t = calm ? 40 : S.t;
      drawResultBG(ctx, t, !r || r.cleared, calm);
      try { FX.drawWorld(ctx); } catch (err) { /* 무시 */ }
    },
  };

  // ===== 7. 이벤트 · 키 처리 · 휴식 알림 (파일을 읽을 때 딱 한 번 등록) =====
  Events.on('paused', () => syncChrome());
  Events.on('sceneChanged', () => {
    S.starting = false; S.lowSaid = false;
    if (Game.scene !== 'play' && S.bossUp) { S.bossUp = false; if (S.els.toasts) S.els.toasts.classList.remove('low'); }     // 타이틀/결과에서는 토스트를 다시 위쪽 자리로
    syncChrome();
  });
  Events.on('touchDetected', () => measure());
  Events.on('windowBlur', () => {                                                   // 창을 벗어나면 자동 일시정지
    if (Game.scene === 'play' && !Game.paused) Game.pause(true);
  });
  Events.on('playerHit', () => {
    HUD.hitT = nowF();
    const p = Game.player;                                                          // 체력이 위험해지면 화면 읽기 도구에 한 번만 알려줘요 (UI-11)
    if (p && p.maxHp > 0 && p.hp > 0) {
      if (p.hp / p.maxHp <= T.hud.lowHpRatio) { if (!S.lowSaid) { S.lowSaid = true; announce('체력이 얼마 안 남았어요! ' + Math.ceil(p.hp) + ' 남았어요'); } }
      else S.lowSaid = false;
    }
  });
  Events.on('playerRevived', () => { S.lowSaid = false; });
  Events.on('playerDied', () => announce('쓰러졌어요!'));
  Events.on('roomStarted', d => {
    const n = Math.round(Number(Game.stage && Game.stage.roomCount)) || 0, i = d ? d.index | 0 : 0, name = d && d.room && d.room.name ? d.room.name : '';
    const p = Game.player, lives = Game.lives;                                      // 방이 바뀔 때 체력·목숨도 같이 알려줘요 (HUD 숫자를 눈으로 볼 수 없는 친구를 위해)
    const status = [p && p.maxHp > 0 ? '체력 ' + Math.ceil(clamp(p.hp || 0, 0, p.maxHp)) : '', lives === Infinity ? '목숨 무한' : (Number.isFinite(lives) ? '목숨 ' + Math.max(0, Math.round(lives)) + '개' : '')].filter(Boolean).join(', ');
    announce('방 ' + (i + 1) + (n ? ' / ' + n : '') + (name ? ', ' + name : '') + (status ? '. ' + status : ''));
  });
  Events.on('comboChanged', d => {
    const c = d ? d.count | 0 : 0;
    if (c > HUD.comboLast) HUD.comboPop = nowF();
    else if (c === 0 && HUD.comboLast >= 3) HUD.ghost = { count: HUD.comboLast, t: nowF() };
    HUD.comboLast = c;
  });
  Events.on('bossSpawned', () => { HUD.boss = null; announce('보스가 나타났어요! 젤리 대왕'); });

  const GAME_KEYS = /^(Arrow(Left|Right|Up|Down)|Key[ZXASD]|Space)$/;
  // 터치 기기에서 손가락이 닿으면 다시 터치 모드로 (키보드로 바꿨다가 화면을 만지면 버튼이 돌아와요)
  window.addEventListener('touchstart', () => { const first = !S.touchSeen; S.touchSeen = true; S.lastPointer = 'touch'; if (S.kbdUsed || first) { S.kbdUsed = false; syncChrome(); } }, { passive: true, capture: true });
  window.addEventListener('pointerdown', ev => { if (ev.pointerType) S.lastPointer = ev.pointerType; }, { passive: true, capture: true });   // 마지막으로 쓴 손(터치/마우스) — 타이틀에서 키보드가 불쑥 뜨지 않게 고를 때 써요
  // 키보드: 창 전체의 capture 단계에서 먼저 받아요 (Esc/P = 일시정지, M = 소리 — 이 한 곳에서만)
  window.addEventListener('keydown', ev => {
    if (ev.isComposing || ev.keyCode === 229) return;                               // 한글 조합 중
    const t = ev.target, typing = isTyping(t), mods = ev.ctrlKey || ev.metaKey || ev.altKey;
    if (ev.code === 'Tab' && (modalOpen() || !S.els.pauseModal.hidden)) { trapTab(ev); return; }
    if (ev.isTrusted && Game.touch && !S.kbdUsed && !typing && Game.scene === 'play' && !Game.paused && GAME_KEYS.test(ev.code)) { S.kbdUsed = true; syncChrome(); }   // 물리 키보드로 플레이하면 터치 버튼은 치워요
    // 타이틀에서 아무 칸/버튼에도 포커스가 없을 때(터치 화면 + 키보드 노트북 등) Enter 로 시작해요
    if (ev.code === 'Enter' && !ev.repeat && !typing && !mods && Game.scene === 'title' && !modalOpen() && (!t || t === doc.body || t === docEl)) { ev.preventDefault(); startGame(); return; }
    if (!typing && !mods && !ev.repeat) {
      if (ev.code === 'KeyM') toggleMute(true);
      else if (ev.code === 'Escape') {
        if (S.modal === 'rank') hideRanking();
        else if (S.modal === 'help') closeModal('help');
        else if (Game.scene === 'play' && !S.portrait) { if (Game.paused) resume(); else Game.pause(true); }
      } else if (ev.code === 'KeyP' && Game.scene === 'play' && !S.portrait && !modalOpen()) { if (Game.paused) resume(); else Game.pause(true); }
    }
    // 난이도 카드에서 화살표 키로 고르기
    if (t && t.classList && t.classList.contains('diff-card') && /^(Arrow(Left|Right|Up|Down)|Home|End)$/.test(ev.code)) {
      const keys = S.els.diffCards.map(c => c.getAttribute('data-diff')), cur = keys.indexOf(S.diff);
      let nx = cur;
      if (ev.code === 'ArrowLeft' || ev.code === 'ArrowUp') nx = (cur + keys.length - 1) % keys.length;
      else if (ev.code === 'ArrowRight' || ev.code === 'ArrowDown') nx = (cur + 1) % keys.length;
      else if (ev.code === 'Home') nx = 0; else nx = keys.length - 1;
      ev.preventDefault(); selectDiff(keys[nx], true); sfx('ui');
      ev.stopPropagation(); return;
    }
    // 랭킹 탭(쉬움/보통/어려움)도 화살표 키로 고르기
    if (t && t.classList && t.classList.contains('rank-tab') && /^(Arrow(Left|Right|Up|Down)|Home|End)$/.test(ev.code)) {
      const tabs = Array.from(t.parentNode.children), cur = tabs.indexOf(t);
      let nx = cur;
      if (ev.code === 'ArrowLeft' || ev.code === 'ArrowUp') nx = (cur + tabs.length - 1) % tabs.length;
      else if (ev.code === 'ArrowRight' || ev.code === 'ArrowDown') nx = (cur + 1) % tabs.length;
      else if (ev.code === 'Home') nx = 0; else nx = tabs.length - 1;
      ev.preventDefault(); ev.stopPropagation();
      tabs[nx].click(); focusEl(tabs[nx]);
      return;
    }
    // 결과 화면이 막 떴을 때는 Space/Enter 로 버튼이 눌리지 않게 삼켜요 (마우스/터치 클릭은 그대로).
    // 꾹 누르고 있는 키(자동 반복 keydown)는 시간이 지나도 늘 삼켜요: 공격 키를 누른 채 결과 화면으로 넘어와도 「다시 하기」가 눌리지 않게 (UI-01). 일부러 누르는 첫 keydown 은 repeat 이 아니라서 그대로 눌려요.
    if (Game.scene === 'result' && S.res && (ev.code === 'Space' || ev.code === 'Enter') && t && t.tagName === 'BUTTON' && S.els.result && S.els.result.contains(t) && (ev.repeat || performance.now() - S.res.t0 < T.result.keyLockMs)) { ev.preventDefault(); ev.stopPropagation(); return; }
    // 일시정지 화면의 버튼은 Enter 를 꾹 눌러도(자동 반복) 계속 눌리지 않아요: 「정말요? 한 번 더」 확인이 뚫리지 않게 (UI-02)
    if (ev.repeat && ev.code === 'Enter' && t && t.tagName === 'BUTTON' && S.els.pauseModal && S.els.pauseModal.contains(t)) { ev.preventDefault(); ev.stopPropagation(); return; }
    // 화면(오버레이)이 떠 있는 동안 포커스된 버튼의 Space/방향키는 게임 입력으로 보내지 않아요 → 버튼이 Space 로도 눌려요
    if (overlayActive() && t && t.tagName === 'BUTTON' && S.els.root && S.els.root.contains(t)) ev.stopPropagation();
  }, true);

  function trapTab(ev) {                                                            // 모달(조작법/랭킹/일시정지) 안에서만 Tab 이 돌게
    const m = S.modal ? S.els[S.modal + 'Modal'] : (S.els.pauseModal.hidden ? null : S.els.pauseModal);
    if (!m) return;
    const f = Array.from(m.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')).filter(x => !x.disabled && !x.hidden);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1], a = doc.activeElement;
    if (!m.contains(a)) { ev.preventDefault(); focusEl(first); }
    else if (ev.shiftKey && a === first) { ev.preventDefault(); focusEl(last); }
    else if (!ev.shiftKey && a === last) { ev.preventDefault(); focusEl(first); }
  }

  // 휴식 알림: play 씬이 실제로 진행된 시간(틱)이 CFG.breakReminderMinutes 를 넘을 때마다 한 번씩 (히트스톱 중에도 시간은 흘러요)
  //   싸우는 중(방의 전투·보스전)에는 잠깐 미뤄서, 방을 깨고 숨 돌릴 때 보여줘요 (UI-08: 보스 체력바를 가리지 않게). 그래도 T.breakDeferTicks 동안 못 쉬면 그냥 보여줘요.
  const inFight = () => { try { return typeof Stage !== 'undefined' && Stage.state === 'fight'; } catch (e) { return false; } };
  Loop.hooks.push(() => {
    if (Game.scene !== 'play' || Game.paused) return;
    S.playTicks++;
    const every = Math.max(1, Math.round((Number(CFG.breakReminderMinutes) || 30) * 3600));
    if (S.playTicks >= (S.reminded + 1) * every) {
      if (!S.breakDue) S.breakDue = S.playTicks;                                    // 알림 시간이 된 순간
      if (inFight() && S.playTicks - S.breakDue < T.breakDeferTicks) return;
      S.reminded = Math.floor(S.playTicks / every); S.breakDue = 0;
      S.breakMsgs++;
      toast(T.breakText, T.breakToastMs);
    }
  });

  window.addEventListener('resize', () => { measure(); setTimeout(measure, 120); });
  window.addEventListener('orientationchange', () => { setTimeout(measure, 150); setTimeout(measure, 500); });
  try { if (window.ResizeObserver && $('app')) new ResizeObserver(() => measure()).observe($('app')); } catch (e) { /* 무시 */ }

  // ===== 8. 공개 API =====
  function showRanking(diff) {                                                     // diff 를 안 주면 타이틀에서 고른 난이도의 랭킹부터
    const d = CFG.difficulty[diff] ? diff : (Game.scene === 'title' ? S.diff : Game.difficulty);
    S.els.rankView.load(CFG.difficulty[d] ? d : undefined); openModal('rank');
  }
  function hideRanking() { closeModal('rank'); S.els.rankView.cancel(); }

  const api = {
    drawHUD,
    toast,
    showRanking, hideRanking,
    // --- 아래는 덤: 테스트/다른 모듈이 쓸 수 있는 것들 ---
    validateNickname: validateNick,
    startGame, restartRun, toTitle, resume, toggleMute,
    resize: measure,
    resetBreakTimer() { S.playTicks = 0; S.reminded = 0; S.breakDue = 0; },
    setReduceMotion, toggleMotion, announce,
    state() {
      const e = S.els;
      return {
        scene: Game.scene, modal: S.modal, paused: !!Game.paused, portrait: S.portrait, u: S.u, hudInset: S.hudInset,
        difficulty: S.diff, nickError: e.nickErr ? e.nickErr.textContent : '', nickValue: e.nick ? e.nick.value : '',
        titleVisible: !!e.title && !e.title.hidden, resultVisible: !!e.result && !e.result.hidden, pauseVisible: !!e.pauseModal && !e.pauseModal.hidden,
        touchVisible: !!e.touchRoot && e.touchRoot.classList.contains('on'), kbdUsed: S.kbdUsed,
        starsShown: S.res ? S.res.shown : 0, starsTotal: S.res ? S.res.total : 0, saveState: S.saveState, saveRetry: !!e.retry && !e.retry.hidden,
        playTicks: S.playTicks, breakMsgs: S.breakMsgs, motion: !reduceMotion(),
        resultTab: e.resRank ? e.resRank.tab() : '', rankTab: e.rankView ? e.rankView.tab() : '', touchSeen: S.touchSeen, lastPointer: S.lastPointer,
      };
    },
  };

  // 화면 부품은 파일을 읽는 즉시 만들어 둬요 (index.html 의 #ui / #touch 안에 JS 로 생성)
  buildChrome(); buildTitle(); buildHelp(); buildRank(); buildPause(); buildResult(); buildTouch();
  S.els.root.append(S.els.hudBtns, S.els.toasts, S.els.live, S.els.rotate);
  selectDiff(CFG.difficulty[Store.get('difficulty', 'normal')] ? Store.get('difficulty', 'normal') : 'normal', false);
  syncMotion(true);
  measure();
  return api;
})();
</script>

<script>
/* =============================================================================
   server 모듈 - 닉네임 검사 / 점수 저장 / 랭킹 (구글 Apps Script 서버 + 내 기기 기록)

   공개 API (docs/ARCHITECTURE.md 5-5)
     Server.available                      google.script.run 을 쓸 수 있는지 (게임을 파일로 열면 false)
     Server.validateNickname(raw)          -> { ok:true, value } | { ok:false, error:'한글 문구' }
     Server.randomNickname()               -> '말랑젤리37' 처럼 귀여운 낱말 둘 + 숫자 두 개 (2~8글자, 늘 validateNickname 을 통과해요). 주사위 버튼·기본 이름용
     Server.saveScore({ nickname, score, stageId, difficulty, stars, cleared, timeSec })
                                           -> Promise<{ ok:true, source:'server'|'local', rank?, warning? }>  (절대 reject 안 함)
                                              warning: 'server_failed' = 서버에 못 올려서 내 기기에만 저장 (error 에 이유, retryable: 다시 보내 볼 만한지 - false 면 서버가 기록 자체를 거절한 거라 소용없어요) / 'no_server' = 서버가 없는 환경
     Server.getTopScores(n=10, difficulty?) -> Promise<[{ rank, nickname, score, stars, difficulty }]>        (절대 reject 안 함)
                                              배열에 숨은 속성 rows.source: 'server' | 'local' (local = 이 기기의 기록이에요)
     Server.call(fn, ...args)              google.script.run 을 Promise 로 (10초 타임아웃, 서버가 없으면 reject)

   저장 흐름
     1) 내 기기(Store 'scores')에는 항상 먼저 적어 둬요. (인터넷이 없어도 내 기록은 남아요)
     2) 서버가 있으면 보내고, 실패하면 '내 기기에만 저장' 으로 알려 줘요.  (서버가 없거나 실패해도 게임은 멈추지 않아요)

   Apps Script 규칙: google.script.run 은 이 파일에서만 써요. 서버로는 숫자/문자열/객체/배열만 보내요(Date, 함수 금지).
   ============================================================================= */

// ===== 숫자/설정 표 (아이가 고쳐 봐도 되는 곳) =====
const SERVER_TUNE = {
  timeoutMs: 10000,        // 서버가 이 시간(밀리초) 안에 답이 없으면 실패로 봐요
  retries: 1,              // 잠깐 실패(네트워크 끊김 등)하면 이 횟수만큼 다시 해 봐요
  retryDelayMs: 1500,      // 다시 해 보기 전에 기다리는 시간
  totalMs: 11000,          // 재시도까지 합쳐 saveScore/getTopScores 가 서버를 기다리는 최대 시간 (결과 화면의 저장 제한 12초보다 짧게!)
  minRetryWindowMs: 1000,  // 재시도하려면 (기다린 뒤) 남은 시간이 최소 이만큼은 있어야 해요
  nick: { min: 2, max: 8 },                  // 닉네임 글자 수
  scoreMax: 99999,                           // 점수 0 ~ 99999 (Code.gs 의 LIMITS_.scoreMax 와 같아야 해요)
  starsMax: 3,                               // 별 0 ~ 3 (클리어하지 않으면 0)
  timeSecMax: 86400,                         // 플레이 시간(초) 0 ~ 24시간
  clearTimeMin: 45,                          // 클리어한 판의 최소 시간(초). 서버가 이보다 짧은 클리어 기록은 거절해요 (Code.gs 의 LIMITS_.clearTimeMin 과 같아야 해요)
  stageIdMax: 20,                            // 스테이지 이름 길이
  stageIds: ['stage1'],                      // 허용하는 스테이지 이름 (STAGES 의 id 와 같아야 해요 - 테스트가 비교해요. Code.gs 의 STAGE_IDS_ 도 같아야 해요)
  defaultStage: 'stage1',
  difficulties: ['easy', 'normal', 'hard'],  // CFG.difficulty 의 키와 같아야 해요 (Code.gs 의 DIFFICULTIES_ 도 같아야 해요)
  rankDefault: 10, rankMax: 50,              // 랭킹 기본 10명, 최대 50명
  localMax: 50,                              // 내 기기에 보관하는 기록 수
};

// ===== 닉네임 금칙어 (Code.gs 의 BLOCKLIST_ / BLOCKLIST_WHOLE_ 와 똑같이 유지해요 - 테스트가 비교해요) =====
//   * 영어는 소문자, 띄어쓰기 없이. 소리가 비슷한 것·숫자를 끼워 넣은 것·글자를 늘여 쓴 것은 아래 NICK-FILTER 도구가 알아서 같이 걸러요.
//   * 시작용 목록이에요. 완벽하지 않으니 어른이 가끔 랭킹을 훑어봐 주세요.
//   * 새 단어는 아래에 한 줄 추가하고, Code.gs 에도 똑같이 추가해요.
// ==== BLOCKLIST START ====
// (1) 이름 어디에 들어 있어도 걸러요.  ※ 띄어쓰기는 무시하고, 비슷한 모양은 자동으로 같게 봐요:
//     시발 = 씨발 = 씨빨 = ㅅㅣ발 = 시ㅂㅏㄹ = 시이발 = 시1발 = 시ㅋ발 (예사소리로 적으면 된소리도 같이 걸러요. 된소리로 적은 낱말은 된소리만)
const NICKNAME_BLOCKLIST = [
  // 한국어 욕설

    const base = s.toLowerCase();
    const hasKo = /[ㄱ-ㅣ가-힣]/.test(base), hasEn = /[a-z]/.test(base);
    const bases = [base];
    if (hasKo) bases.push(base.replace(/[ㄱ-ㅣ]/g, ''));
    if (hasKo && hasEn) bases.push(base.replace(/[a-z]/g, ''), base.replace(/[ㄱ-ㅣa-z]/g, ''), base.replace(/[ㄱ-ㅣ가-힣]/g, ''));
    const forms = [];
    bases.forEach(function (b) {
      forms.push(
        b,
        b.replace(/[0-9]/g, function (c) { return LEET_[c] || c; }),
        b.replace(/[0-9]/g, function (c) { return c === '1' ? 'l' : (LEET_[c] || c); }),
        b.replace(/[0-9]/g, '')
      );
    });
    const all = forms.concat(forms.map(function (f) { return f.replace(NICK_LAUGH_LIGHT_, ''); }));
    return all.filter(function (f, i) { return all.indexOf(f) === i; });
  }

  /** 금칙어가 들어 있는 이름인가 (이미 정리된 닉네임을 넣어요) */
  function nickBlocked_(s) {
    const variants = nickVariants_(s);
    for (let i = 0; i < variants.length; i++) {
      const v = variants[i];
      const flat = v.replace(/ /g, '');                                                  // 띄어쓰기는 없는 셈 (f u c k)
      const skeleton = nickSkeleton_(flat);
      const typed = nickSkeleton_(flat.replace(/[가-힣]/g, NICK_BARRIER_));      // 완성형 글자를 막아 둔 것: 자음 줄임말 찾기용
      for (let j = 0; j < BLOCKLIST_.length; j++) {
        const p = nickPattern_(BLOCKLIST_[j]);
        if (p.strong && p.strong.test(p.jamoOnly ? typed : skeleton)) return true;
      }
      const core = nickSkeleton_(v.replace(NICK_LAUGH_, ''));
      for (let j = 0; j < BLOCKLIST_WHOLE_.length; j++) {
        const p = nickPattern_(BLOCKLIST_WHOLE_[j]);
        if (p.whole && p.whole.test(core)) return true;
      }
    }
    return false;
  }
  // ==== NICK-FILTER END ====

  const nickBad = error => ({ ok: false, error });
  const nickKey = s => String(s).normalize('NFC').toLowerCase();         // 닉네임 비교용 (대소문자 무시)

  function validateNickname(raw) {
    const s = nickClean_(raw === undefined || raw === null ? '' : String(raw));
    if (!s) return nickBad('이름을 적어 주세요!');
    if (!NICK_ALLOWED_.test(s)) return nickBad('이름에는 한글, 영어, 숫자만 쓸 수 있어요.');
    if (s.length < T.nick.min) return nickBad('이름은 ' + T.nick.min + '글자 이상으로 적어 주세요.');
    if (s.length > T.nick.max) return nickBad('이름은 ' + T.nick.max + '글자까지만 쓸 수 있어요.');
    if (nickBlocked_(s)) return nickBad('이 이름은 쓸 수 없어요. 다른 이름을 적어 줄래요?');
    return { ok: true, value: s };
  }

  // 닉네임 만들어 주기 (주사위 버튼·기본 이름): 귀여운 낱말 둘 + 숫자 두 개. 같은 이름을 쓰는 친구가 겹치지 않게 숫자를 붙여요.
  // 낱말을 바꾸거나 늘려도 돼요 - 모든 짝(낱말 × 낱말 × 숫자)이 validateNickname 을 통과하는지 테스트가 전부 확인해요.
  const NICK_WORDS = {
    adj: ['말랑', '폭신', '반짝', '보들', '쫀득', '달콤', '몽글', '포근', '용감', '씩씩', '방긋', '보송', '통통', '동글', '사뿐', '새콤', '상큼', '깜찍', '튼튼', '빙글', '쑥쑥', '활짝', '뭉실', '날쌘'],
    noun: ['젤리', '사탕', '구름', '별빛', '용사', '토끼', '푸딩', '마카롱', '솜사탕', '별님', '달님', '고래', '펭귄', '햄찌', '쿠키', '초코', '딸기', '포도', '수박', '감자', '꿀벌', '공룡', '슬라임', '새싹', '곰돌', '눈송이'],
  };
  function randomNickname() {                                           // 난수는 게임 난수(rand/pick)를 써요: RNG.seed 로 재현돼요
    for (let i = 0; i < 20; i++) {
      const r = validateNickname(pick(NICK_WORDS.adj) + pick(NICK_WORDS.noun) + randInt(10, 99));
      if (r.ok) return r.value;
    }
    return '젤리용사' + randInt(10, 99);                                // (여기까지 올 일은 없어요)
  }

  // ---------------------------------------------------------------------------
  // 2. 순위 만들기 (내 기기 기록용. 서버(Code.gs)의 buildRanking_ 과 같은 규칙)
  //    닉네임별 최고 점수만 / 점수 높은 순 / 같으면 먼저 달성한 쪽이 위
  // ---------------------------------------------------------------------------
  const betterThan = (a, b) => a.score !== b.score ? a.score > b.score : a.t < b.t;

  function makeRanking(entries, n, difficulty) {
    const best = new Map();
    for (const e of entries) {
      if (difficulty && e.difficulty !== difficulty) continue;
      const k = nickKey(e.nickname), cur = best.get(k);
      if (!cur || betterThan(e, cur)) best.set(k, e);
    }
    return [...best.values()]
      .sort((a, b) => betterThan(a, b) ? -1 : (betterThan(b, a) ? 1 : 0))     // (정렬은 안정적이라 완전히 같으면 들어온 순서 유지)
      .slice(0, n)
      .map((e, i) => ({ rank: i + 1, nickname: e.nickname, score: e.score, stars: e.stars, difficulty: e.difficulty }));
  }

  // ---------------------------------------------------------------------------
  // 3. 내 기기 랭킹 (Store 'scores', 최대 50개)
  //    "닉네임 + 난이도" 마다 가장 좋은 기록 하나만 보관해요. (난이도별 랭킹도 서버처럼 볼 수 있게)
  // ---------------------------------------------------------------------------
  function cleanEntry(r) {                                              // 깨진 기록은 버려요 (Store 값은 믿지 않아요)
    if (!r || typeof r !== 'object') return null;
    const nickname = typeof r.nickname === 'string' ? r.nickname.trim() : '';
    const score = Number(r.score);
    if (!nickname || !isFinite(score) || !T.difficulties.includes(r.difficulty)) return null;
    const stars = Math.round(Number(r.stars));
    return {
      nickname, score: Math.round(score), stars: isFinite(stars) ? clamp(stars, 0, T.starsMax) : 0, difficulty: r.difficulty,
      stageId: typeof r.stageId === 'string' ? r.stageId : T.defaultStage,
      timeSec: isFinite(Number(r.timeSec)) ? Math.max(0, Math.round(Number(r.timeSec))) : 0,
      cleared: !!r.cleared, t: isFinite(Number(r.t)) ? Number(r.t) : 0,
    };
  }

  function localLoad() {
    const raw = Store.get(LOCAL_KEY, []);
    return Array.isArray(raw) ? raw.map(cleanEntry).filter(Boolean) : [];
  }

  const rankOf = (rows, nickname) => { const k = nickKey(nickname), row = rows.find(r => nickKey(r.nickname) === k); return row ? row.rank : 0; };

  function localRecord(p) {                                             // 기록 하나 추가 -> 내 기기 안에서의 등수(전체 난이도 기준)
    const list = localLoad(), k = nickKey(p.nickname);
    const entry = { nickname: p.nickname, score: p.score, stars: p.stars, difficulty: p.difficulty, stageId: p.stageId, timeSec: p.timeSec, cleared: p.cleared, t: clock() };
    const i = list.findIndex(e => nickKey(e.nickname) === k && e.difficulty === p.difficulty);
    if (i < 0) list.push(entry);
    else if (p.score > list[i].score) list[i] = entry;                  // 더 높을 때만 바꿔요 (같은 점수면 먼저 달성한 기록 유지)
    list.sort((a, b) => betterThan(a, b) ? -1 : (betterThan(b, a) ? 1 : 0));
    if (list.length > T.localMax) list.length = T.localMax;
    Store.set(LOCAL_KEY, list);
    return rankOf(makeRanking(list, T.localMax, null), p.nickname);
  }

  const localTop = (n, difficulty) => makeRanking(localLoad(), n, difficulty);
  const local = {
    load: localLoad,
    record: localRecord,
    top: localTop,
    clear() { Store.set(LOCAL_KEY, []); },
  };

  // ---------------------------------------------------------------------------
  // 4. google.script.run -> Promise
  // ---------------------------------------------------------------------------
  function getRun() {
    try { return (typeof google !== 'undefined' && google && google.script && google.script.run) || null; } catch (e) { return null; }
  }

  function makeError(code, message, extra) {
    const err = new Error(message);
    err.code = code;                                                    // 'unavailable' | 'timeout' | 'nofunction' | 'failed'
    return Object.assign(err, extra);
  }

  // 서버가 던진 오류 -> 메시지 정리. rejected: Code.gs 가 일부러 거절한 것(한글 문구, [busy] 아님) → 다시 해도 소용없어요.
  function failureError(err) {
    let msg = err && err.message !== undefined ? err.message : err;
    msg = String(msg === undefined || msg === null ? '' : msg).replace(/^\s*(Error|Exception):\s*/i, '');
    return makeError('failed', msg || 'server failed', { rejected: /[가-힣]/.test(msg) && !msg.includes(BUSY_TAG) });
  }

  function toPlain(v) {                                                 // 숫자/문자열/객체/배열만 보내요 (함수 제거, Date 는 글자로)
    const json = JSON.stringify(v);
    return json === undefined ? null : JSON.parse(json);
  }

  function callOnce(timeoutMs, fn, args) {
    return new Promise((resolve, reject) => {
      const run = getRun();
      if (!run) { reject(makeError('unavailable', 'google.script.run 을 쓸 수 없어요')); return; }
      let done = false, timer = 0;
      const settle = (ok, value) => { if (done) return; done = true; clearTimeout(timer); (ok ? resolve : reject)(value); };   // 먼저 온 쪽만 인정
      timer = setTimeout(() => settle(false, makeError('timeout', '서버가 ' + Math.max(1, Math.round(timeoutMs / 1000)) + '초 안에 답하지 않았어요')), timeoutMs);
      try {
        // 서버 함수 이름 검사: 밑줄로 끝나면 비공개, Object 기본 이름(constructor 등)·with… 도우미는 서버 함수가 아니라서 답이 영영 안 와요
        if (typeof fn !== 'string' || !/^[A-Za-z][A-Za-z0-9_]*$/.test(fn) || fn.endsWith('_') || fn in Object.prototype || RUN_HELPERS.includes(fn)) throw makeError('nofunction', '서버 함수 이름이 올바르지 않아요: ' + fn);
        const plain = args.map(toPlain);
        const runner = run.withSuccessHandler(v => settle(true, v)).withFailureHandler(err => settle(false, failureError(err)));
        if (typeof runner[fn] !== 'function') throw makeError('nofunction', '서버에 ' + fn + ' 함수가 없어요');
        runner[fn](...plain);
      } catch (err) {
        settle(false, err && err.code ? err : failureError(err));
      }
    });
  }

  const call = (fn, ...args) => callOnce(T.timeoutMs, fn, args);                // 공개 API: T.timeoutMs(10초) 안에 답이 없으면 reject

  const isTransient = err => !!err && err.code === 'failed' && !err.rejected;     // 시간 초과·함수 없음·일부러 거절한 것은 다시 해도 소용없어요

  async function callWithRetry(fn, ...args) {                           // 한 번 실패하면 잠깐 뒤 다시 (전체 시간은 T.totalMs 를 넘기지 않아요)
    const t0 = Date.now();
    const left = () => T.totalMs - (Date.now() - t0);
    let last = null;
    for (let attempt = 0; attempt <= T.retries; attempt++) {
      try { return await callOnce(Math.max(1, Math.min(T.timeoutMs, left())), fn, args); }
      catch (err) {
        last = err;
        if (!isTransient(err) || attempt >= T.retries) break;
        if (left() - T.retryDelayMs < T.minRetryWindowMs) break;        // 남은 시간이 너무 짧으면 포기
        await sleep(T.retryDelayMs);
      }
    }
    throw last;
  }

  // ---------------------------------------------------------------------------
  // 5. 점수 저장
  // ---------------------------------------------------------------------------
  function cleanPayload(raw) {                                          // 클라이언트 쪽 정리(친절하게 고쳐 줌). 진짜 검사는 서버가 다시 해요.
    const p = raw && typeof raw === 'object' ? raw : {};
    const nick = validateNickname(p.nickname);
    if (!nick.ok) return { ok: false, error: nick.error };
    const int = (v, lo, hi, d) => { const x = Math.round(Number(v)); return isFinite(x) ? clamp(x, lo, hi) : d; };
    const stageId = String(p.stageId === undefined || p.stageId === null ? '' : p.stageId);
    const cleared = !!p.cleared;
    return {
      ok: true,
      payload: {
        nickname: nick.value,
        score: int(p.score, 0, T.scoreMax, 0),
        stars: cleared ? int(p.stars, 0, T.starsMax, 0) : 0,            // 별은 클리어했을 때만 (서버도 같은 규칙으로 거절해요)
        difficulty: T.difficulties.includes(p.difficulty) ? p.difficulty : 'normal',
        stageId: /^[A-Za-z0-9_-]+$/.test(stageId) && stageId.length <= T.stageIdMax && T.stageIds.includes(stageId) ? stageId : T.defaultStage,
        cleared,
        timeSec: int(p.timeSec, 0, T.timeSecMax, 0),
      },
    };
  }

  const inflight = new Map();                                           // 저장 중인 기록 (더블클릭하면 같은 약속을 돌려줘요)

  function saveScore(raw) {
    let c;
    try { c = cleanPayload(raw); } catch (err) { c = { ok: false, error: '기록을 저장할 수 없어요.' }; }
    if (!c.ok) return Promise.resolve({ ok: false, source: 'none', error: c.error });
    const p = c.payload;
    const key = [nickKey(p.nickname), p.score, p.difficulty, p.stageId, p.stars, p.cleared, p.timeSec].join('|');
    if (inflight.has(key)) return inflight.get(key);
    const job = doSave(p).finally(() => inflight.delete(key));
    inflight.set(key, job);
    return job;
  }

  async function doSave(p) {                                            // 무슨 일이 있어도 reject 하지 않아요 (맨 아래 catch 가 마지막 안전망)
    try { return await doSaveInner(p); }
    catch (err) { warn('저장 중 예상 못 한 오류', err); return { ok: true, source: 'local', warning: 'server_failed', retryable: true, error: String((err && err.message) || err) }; }
  }

  async function doSaveInner(p) {
    let localRank = 0;
    try { localRank = localRecord(p); } catch (err) { warn('내 기기 저장 실패', err); }   // 내 기기에 먼저 (실패해도 서버 저장은 계속)
    if (!getRun()) return { ok: true, source: 'local', rank: localRank || undefined, warning: 'no_server' };
    try {
      const res = await callWithRetry('saveScore', p);
      if (!res || res.ok !== true) throw makeError('failed', '서버가 저장하지 못했어요');
      return { ok: true, source: 'server', rank: Number.isInteger(res.rank) && res.rank > 0 ? res.rank : undefined };
    } catch (err) {
      warn('서버 저장 실패 → 내 기기에만 저장', err && err.message);
      return { ok: true, source: 'local', rank: localRank || undefined, warning: 'server_failed', retryable: !(err && err.rejected), error: String((err && err.message) || err) };   // retryable=false: 서버가 기록 자체를 거절했어요(한글 오류 문구). 다시 보내도 소용없으니 "다시 보내 볼까요?" 단추를 보이지 않아도 돼요
    }
  }

  // ---------------------------------------------------------------------------
  // 6. 랭킹 조회 (서버 먼저, 안 되면 내 기기)
  // ---------------------------------------------------------------------------
  function normalizeRows(rows, n) {                                     // 서버 응답이 이상하면 null (→ 내 기기 랭킹으로)
    if (!Array.isArray(rows)) return null;
    const out = [];
    rows.forEach((r, i) => {
      if (!r || typeof r !== 'object' || !isFinite(Number(r.score)) || r.nickname === undefined || r.nickname === null) return;
      const stars = Math.round(Number(r.stars));
      out.push({
        rank: Number.isInteger(r.rank) && r.rank > 0 ? r.rank : i + 1,
        nickname: String(r.nickname), score: Math.round(Number(r.score)),
        stars: isFinite(stars) ? clamp(stars, 0, T.starsMax) : 0, difficulty: String(r.difficulty === undefined ? '' : r.difficulty),
      });
    });
    if (rows.length && !out.length) return null;
    return out.slice(0, n);
  }

  const tagSource = (rows, source) => Object.defineProperty(rows, 'source', { value: source, enumerable: false });   // rows.source: 'server' | 'local'

  async function getTopScores(n, difficulty) {                          // 무슨 일이 있어도 reject 하지 않아요
    try { return await getTopScoresInner(n, difficulty); }
    catch (err) { warn('랭킹 조회 중 예상 못 한 오류', err); return tagSource([], 'local'); }
  }

  async function getTopScoresInner(n, difficulty) {
    const num = Math.floor(Number(n === undefined || n === null || n === '' ? T.rankDefault : n));
    const limit = isFinite(num) ? clamp(num, 1, T.rankMax) : T.rankDefault;
    const diff = T.difficulties.includes(difficulty) ? difficulty : null;
    if (getRun()) {
      try {
        const rows = normalizeRows(await callWithRetry('getTopScores', limit, diff), limit);
        if (rows) return tagSource(rows, 'server');
        warn('서버 랭킹 응답이 이상해요');
      } catch (err) { warn('서버 랭킹 실패 → 내 기기 랭킹', err && err.message); }
    }
    return tagSource(localTop(limit, diff), 'local');
  }

  // ---------------------------------------------------------------------------
  // 공개 API
  // ---------------------------------------------------------------------------
  const api = {
    get available() { return !!getRun(); },
    validateNickname, randomNickname, saveScore, getTopScores, call,
    config: T,                                                          // 타임아웃 등 (테스트에서 줄여 쓰기)
    blocklist: NICKNAME_BLOCKLIST,                                      // 이름 어디에 들어 있어도 걸러요 (배열에 단어를 push 하면 바로 적용돼요)
    blocklistWhole: NICKNAME_BLOCKLIST_WHOLE,                           // 이름 전체가 이 낱말일 때만 걸러요
    nickWords: NICK_WORDS,                                              // randomNickname 이 쓰는 낱말 (테스트가 전부 짝지어 확인해요)
    nickSkeleton: nickSkeleton_, nickBlocked: nickBlocked_,             // 필터 내부 (테스트가 Code.gs 와 비교해요)
    local,
    now: () => Date.now(),                                              // 내 기기 기록의 시각 (테스트에서 바꿔 끼움)
  };
  return api;
})();
</script>

<script>
/* ==========================================================================
   js_main.html — 부팅 (core 모듈). 모든 모듈이 로드된 뒤 마지막에 실행됩니다. (계약서 5-6)
   ========================================================================== */

// 전역 오류는 기록만 남기고 게임은 멈추지 않아요 (아이가 하던 판이 오류 하나로 끝나면 안 되니까)
window.onerror = function (message, source, line, col, error) {
  console.error('[window.onerror]', message, `${source}:${line}:${col}`, error && error.stack ? error.stack : '');
};
window.onunhandledrejection = function (ev) {
  console.error('[unhandledrejection]', ev && ev.reason);
};

Loop.start();
Game.setScene(Scenes.title ? 'title' : (Scenes.play ? 'play' : 'boot'));   // 'boot' 씬(로딩 문구)은 core 가 기본 제공
</script>

</body>
</html>
