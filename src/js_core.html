// ===== 1-1. 난수 (시드 가능 → 테스트 재현). Math.random 은 쓰지 않아요 =====
const RNG = (() => {
  // mulberry32: 작고 빠르고 시드로 똑같이 재현되는 난수
  function make(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let game, cosmetic;
  const api = {
    // 시드를 정하면 게임 난수와 "연출 난수"가 둘 다 재현돼요.
    // 연출 난수(입자 방향·소리 떨림)는 따로 굴려서, 입자 개수가 바뀌어도 데미지/AI 난수열은 그대로 유지됩니다.
    seed(n) {
      n = Number(n);
      if (!isFinite(n)) n = 1;
      n = Math.floor(n);
      game = make(n);
      cosmetic = make(n ^ 0x5bd1e995);
    },
    next() { return game(); },
    fx() { return cosmetic(); },       // 연출 전용 (FX/SFX 가 사용)
  };
  api.seed((Date.now() & 0x7fffffff) ^ Math.floor(performance.now() * 1000));
  return api;
})();
const rand = () => RNG.next();                       // 0 이상 1 미만
const randInt = (a, b) => {                          // a~b (양끝 포함)
  a = Math.ceil(a); b = Math.floor(b);
  if (b < a) { const t = a; a = b; b = t; }
  return a + Math.floor(rand() * (b - a + 1));
};
const pick = arr => (arr && arr.length ? arr[Math.floor(rand() * arr.length)] : undefined);
const chance = p => rand() < p;

// ===== 1-2. 저장소: localStorage 래퍼 ('jd:' 접두어). 막혀 있으면 메모리로 대신 =====
const Store = (() => {
  const PREFIX = 'jd:';
  const mem = {};                                    // 메모리 폴백 (JSON 문자열로 보관 → 복사본 반환)
  const ls = () => { try { return window.localStorage; } catch (e) { return null; } };
  return {
    get(key, fallback) {
      if (Object.prototype.hasOwnProperty.call(mem, key)) {
        try { return JSON.parse(mem[key]); } catch (e) { /* 아래로 */ }
      }
      try {
        const s = ls();
        const raw = s ? s.getItem(PREFIX + key) : null;
        if (raw !== null && raw !== undefined) return JSON.parse(raw);
      } catch (e) { /* 막혀 있거나 깨진 값 → 폴백 */ }
      return fallback;
    },
    set(key, value) {
      if (value === undefined) { Store.remove(key); return; }
      let json;
      try { json = JSON.stringify(value); } catch (e) { return; }
      if (json === undefined) return;
      mem[key] = json;                               // 항상 메모리에도 (localStorage 가 막혀도 이번 접속 동안은 기억)
      try { const s = ls(); if (s) s.setItem(PREFIX + key, json); } catch (e) { /* 용량 초과/차단 → 메모리만 */ }
    },
    remove(key) {
      delete mem[key];
      try { const s = ls(); if (s) s.removeItem(PREFIX + key); } catch (e) { /* 무시 */ }
    },
  };
})();

// ===== 2. 설정 · 전역 상태 =====
const CFG = {

    normal: { label: '보통',   desc: '목숨 3개',           dmgTaken: 1.0, enemyHp: 1.0, enemySpeed: 1.0, windupMul: 1.0, lives: 3,        revivePenalty: 0,   maxAttackers: 2 },
    hard:   { label: '어려움', desc: '목숨 1개, 도전!',     dmgTaken: 1.5, enemyHp: 1.3, enemySpeed: 1.1, windupMul: 0.8, lives: 1,        revivePenalty: 0,   maxAttackers: 3 },
  },

// ===== 2-1. 이벤트: 모듈끼리 서로를 몰라도 소식을 주고받는 우체통 =====
const Events = (() => {
  const map = new Map();
  return {
    on(name, fn) {
      if (typeof fn !== 'function') return fn;
      let a = map.get(name);
      if (!a) { a = []; map.set(name, a); }
      a.push(fn);
      return fn;
    },
    off(name, fn) {
      const a = map.get(name);
      if (!a) return;
      const i = a.indexOf(fn);
      if (i >= 0) a.splice(i, 1);
    },
    emit(name, data) {
      const a = map.get(name);
      if (!a || !a.length) return;
      for (const fn of a.slice()) {                  // 복사본을 돌아서, 핸들러가 off 해도 안전
        try { fn(data); } catch (e) { console.error(`[Events] '${name}' 핸들러에서 오류:`, e); }
      }
    },
    // 테스트용: name 의 모든 리스너를 지움 (name 생략 시 전부)
    clear(name) { if (name === undefined) map.clear(); else map.delete(name); },
  };
})();

const Game = {
  scene: 'boot',              // 'boot' | 'title' | 'play' | 'result'
  paused: false,
  difficulty: 'normal',       // 'easy' | 'normal' | 'hard'
  nickname: '',
  touch: false,               // 터치 기기 여부 (아래에서 감지, 첫 touchstart 때 true 로 갱신)
  frame: 0,                   // play 씬에서 실제로 진행된 update 수 (일시정지/히트스톱 제외)
  score: 0, kills: 0, deaths: 0, lives: 3,
  combo: { count: 0, timer: 0, max: 0 },
  player: null, boss: null,
  world: { width: 960 },      // 현재 방 너비
  stage: { id: '', name: '', roomIndex: 0, roomCount: 0, roomName: '' },
  result: null,
  get diff() { return CFG.difficulty[Game.difficulty] || CFG.difficulty.normal; },

  // 씬 전환: 이전 씬 exit → 전환 → 새 씬 enter → 입력 초기화 → 이벤트
  setScene(name) {
    const from = Game.scene;
    const prev = Scenes[from];
    try { if (prev && prev.exit) prev.exit(); } catch (e) { Debug.logOnce(`Scenes.${from}.exit`, e); }
    Game.scene = name;
    const next = Scenes[name];
    try { if (next && next.enter) next.enter(); } catch (e) { Debug.logOnce(`Scenes.${name}.enter`, e); }
    Input.clear();
    Events.emit('sceneChanged', { from, to: name });
  },
  pause(on = true) {
    Game.paused = !!on;
    Input.clear();
    Events.emit('paused', { on: Game.paused });
  },
  // 새 런 시작 전 점수/목숨/콤보 등을 깨끗이 (Entities/FX 는 건드리지 않음)
  resetRun(opts) {
    const o = opts || {};
    if (o.difficulty && CFG.difficulty[o.difficulty]) Game.difficulty = o.difficulty;
    if (typeof o.nickname === 'string') Game.nickname = o.nickname;
    Game.score = 0; Game.kills = 0; Game.deaths = 0; Game.frame = 0;
    Game.lives = Game.diff.lives;
    Game.combo.count = 0; Game.combo.timer = 0; Game.combo.max = 0;
    Game.boss = null;
    Game.result = null;
  },
  addScore(n) {
    n = Math.round(Number(n));
    if (isFinite(n)) Game.score += n;
  },
  // (덤) 콤보 타이머를 1프레임 줄이고, 0 이 되면 콤보를 끊는다. play 씬 update 에서 부를 수 있음.
  tickCombo() {
    const c = Game.combo;
    if (c.timer > 0 && --c.timer === 0 && c.count > 0) {
      c.count = 0;
      Events.emit('comboChanged', { count: 0, max: c.max });
    }
  },
};

// 터치 기기 감지: 처음엔 추측(포인터 종류/ontouchstart), 첫 touchstart 때 확정
(() => {
  try { Game.touch = !!((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window)); }
  catch (e) { Game.touch = false; }
  window.addEventListener('touchstart', () => {
    if (!Game.touch) { Game.touch = true; Events.emit('touchDetected', {}); }
  }, { passive: true });
})();

// ===== 3. 입력 =====
//   코드(e.code) 기준이라 한글 입력 상태에서도 동작해요. Space 는 KeyZ(공격)로 별칭.
const Input = (() => {
  const down = {}, pressed = {};
  const norm = code => (code === 'Space' ? 'KeyZ' : code);
  const PREVENT = { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1, Space: 1 };   // 이 키만 스크롤 방지
  const isTyping = t => !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable === true);

  const api = {
    down, pressed,
    isDown(code) { return !!down[norm(code)]; },
    wasPressed(code) { return !!pressed[norm(code)]; },
    press(code) {
      code = norm(code);
      if (!code) return;
      if (!down[code]) pressed[code] = true;        // 키 반복(꾹 누름)으로는 '막 눌림'이 다시 켜지지 않음
      down[code] = true;
    },
    release(code) { delete down[norm(code)]; },
    endFrame() { for (const k in pressed) delete pressed[k]; },     // Loop 만 호출
    clear() {
      for (const k in down) delete down[k];
      for (const k in pressed) delete pressed[k];
    },
    // 화면 버튼(터치/마우스)을 키처럼 쓰기. 손가락이 버튼 밖으로 나가도 계속 눌린 상태를 유지(setPointerCapture)
    bindButton(el, code) {
      if (!el) return () => {};
      const ids = new Set();                         // 이 버튼을 누르고 있는 손가락(포인터)들
      el.style.touchAction = 'none';
      el.style.userSelect = 'none';
      el.style.webkitUserSelect = 'none';
      el.style.webkitTouchCallout = 'none';
      const onDown = e => {
        if (e.cancelable) e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* 가짜 포인터 등 → 캡처 없이 진행 */ }
        ids.add(e.pointerId);
        api.press(code);
      };
      const onUp = e => {
        ids.delete(e.pointerId);
        if (ids.size === 0) api.release(code);
      };
      const onLeave = e => {                        // 캡처 중이면 버튼 밖으로 나가도 유지
        let captured = false;
        try { captured = el.hasPointerCapture(e.pointerId); } catch (err) { captured = false; }
        if (!captured) onUp(e);
      };
      const noMenu = e => e.preventDefault();       // 길게 누르면 뜨는 메뉴 방지
      el.addEventListener('pointerdown', onDown);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
      el.addEventListener('lostpointercapture', onUp);
      el.addEventListener('pointerleave', onLeave);
      el.addEventListener('contextmenu', noMenu);
      return function unbind() {                    // (덤) 버튼을 없앨 때 부르면 깔끔
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        el.removeEventListener('lostpointercapture', onUp);
        el.removeEventListener('pointerleave', onLeave);
        el.removeEventListener('contextmenu', noMenu);
        ids.clear(); api.release(code);
      };
    },
  };

  window.addEventListener('keydown', e => {
    if (isTyping(e.target)) return;                  // 닉네임 입력 중이면 게임 키가 아님
    if (PREVENT[e.code] && e.cancelable) e.preventDefault();
    api.press(e.code);
  });
  window.addEventListener('keyup', e => { api.release(e.code); });   // 떼는 건 언제나 안전 (키가 눌린 채 고착 방지)
  document.addEventListener('focusin', e => { if (isTyping(e.target)) api.clear(); });   // 입력칸으로 포커스가 가면 눌린 키 해제

  // 창이 포커스를 잃거나 탭이 숨겨지면: 눌린 키 해제 + 알림 (UI 가 자동 일시정지)
  const onBlur = () => { api.clear(); Events.emit('windowBlur'); };
  window.addEventListener('blur', onBlur);
  document.addEventListener('visibilitychange', () => { if (document.hidden) onBlur(); });
  return api;
})();

// ===== 4. 소리: WebAudio 로 전부 합성 (파일 없음) =====
//   SFX 와 Music 은 같은 오디오 그래프(AudioContext)를 나눠 쓰려고 한 함수 안에서 같이 만들어요.
const [SFX, Music] = (() => {
  const T = CORE_TUNE.audio;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);                 // MIDI 번호 → 주파수
  const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const midiOf = name => {                                          // 'C#5' → 73
    const m = /^([A-G])([#b]?)(\d)$/.exec(name);
    if (!m) return null;
    return (Number(m[3]) + 1) * 12 + NOTE_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  };
  const N = name => hz(midiOf(name));                               // 'C6' → 1046.5 Hz

  let G = null;                                                     // 오디오 그래프 (SFX.init 이후)

  // 소프트 리미터 곡선: 작은 소리는 그대로, 큰 소리는 부드럽게 눌러 1.0 을 절대 넘지 않게 (여러 소리가 겹쳐도 찢어지지 않음)
  const SOFT_CURVE = (() => {
    const n = 4096, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const s = 3 * (-1 + 2 * i / (n - 1)), a = Math.abs(s);                // 입력 -3 ~ 3 을 곡선 위로 펼침
      c[i] = Math.sign(s) * (a < 0.6 ? a : 0.6 + 0.4 * Math.tanh((a - 0.6) / 0.4));
    }
    return c;
  })();

  // ---- 오디오 그래프: 효과음/음악 → 소프트 리미터 → 마스터 볼륨 → 스피커 ----
  function makeGraph(ac, offline) {
    const master = ac.createGain(); master.gain.value = T.master;
    const pre = ac.createGain(); pre.gain.value = 1 / 3;
    const lim = ac.createWaveShaper(); lim.curve = SOFT_CURVE; lim.oversample = '2x';
    const sfxBus = ac.createGain(); sfxBus.gain.value = T.sfx;
    const musicBus = ac.createGain(); musicBus.gain.value = T.music;
    sfxBus.connect(pre); musicBus.connect(pre); pre.connect(lim); lim.connect(master); master.connect(ac.destination);
    // 흰 잡음 2초 (고정 시드 → 어디서나 같은 소리)
    const len = Math.floor(ac.sampleRate * 2);
    const noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = noise.getChannelData(0);
    let s = 12345;
    for (let i = 0; i < len; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; d[i] = (s / 4294967296) * 2 - 1; }
    return { ac, master, lim, sfxBus, musicBus, noise, offline: !!offline };
  }

  // ---- 소리 부품: o() = 음(오실레이터), n() = 걸러낸 잡음. 시간 단위는 초 ----
  //   at: 시작 지연 / f→f2: 주파수가 미끄러짐 / dur: 길이 / v: 음량 / a: 어택 / hold: 한동안 유지 / lp: 부드럽게(로우패스)
  function makeSynth(g, bus, t0, rate, vol) {
    const ac = g.ac;
    function o(p) {
      const type = p.type || 'sine', at = p.at || 0, dur = Math.max(0.02, p.dur || 0.15);
      const a = Math.min(p.a === undefined ? 0.004 : p.a, dur * 0.4);
      const hold = Math.max(0, Math.min(p.hold || 0, dur - a - 0.01));
      const t = t0 + at;
      const osc = ac.createOscillator(), env = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(p.f * rate, t);
      if (p.f2 && p.f2 !== p.f) osc.frequency.exponentialRampToValueAtTime(p.f2 * rate, t + dur);
      const v = (p.v === undefined ? 0.3 : p.v) * vol;
      env.gain.setValueAtTime(0.0001, t);
      env.gain.linearRampToValueAtTime(Math.max(v, 0.0002), t + a);
      if (hold > 0) env.gain.setValueAtTime(Math.max(v, 0.0002), t + a + hold);
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      let node = osc;
      if (p.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = p.lp; node.connect(f); node = f; }
      node.connect(env); env.connect(bus);
      if (p.vib) {                                                  // 떨림(비브라토): "보잉~" 같은 소리
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = p.vib; lg.gain.value = (p.vibD || 20) * rate;
        lfo.connect(lg); lg.connect(osc.frequency);
        lfo.start(t); lfo.stop(t + dur + 0.05);
      }
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    function n(p) {
      const at = p.at || 0, dur = Math.max(0.02, p.dur || 0.1), t = t0 + at;
      const a = Math.min(p.a === undefined ? 0.004 : p.a, dur * 0.4);
      const src = ac.createBufferSource();
      src.buffer = g.noise; src.loop = true;
      const f = ac.createBiquadFilter();
      f.type = p.type || 'bandpass'; f.Q.value = p.q || 1;
      f.frequency.setValueAtTime((p.f || 1000) * rate, t);
      if (p.f2) f.frequency.exponentialRampToValueAtTime(p.f2 * rate, t + dur);
      const env = ac.createGain();
      const v = (p.v === undefined ? 0.3 : p.v) * vol;
      env.gain.setValueAtTime(0.0001, t);
      env.gain.linearRampToValueAtTime(Math.max(v, 0.0002), t + a);
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(env); env.connect(bus);
      src.start(t, g.offline ? 0 : RNG.fx() * 1.0);                 // 시작 위치를 바꿔 매번 조금 다른 바람소리
      src.stop(t + dur + 0.05);
    }
    return { o, n };
  }

  // ---- 효과음 ----
  const last = {};                                   // 소리별 마지막 재생 시각
  let live = [];                                     // 아직 울리는 중인 소리들의 끝나는 시각
  const sfx = {
    muted: !!Store.get('muted', false),
    names: Object.keys(SOUNDS),
    // 사용자 클릭/키 입력 안에서 호출. 여러 번 불러도 안전. 오디오가 없으면 조용히 아무것도 안 함
    init() {
      try {
        if (!G) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          G = makeGraph(new AC());
          applyMute(true);
          wakeMusic();
        }
        if (G.ac.state === 'suspended' || G.ac.state === 'interrupted') { const p = G.ac.resume(); if (p && p.catch) p.catch(() => {}); }   // (iOS 는 'interrupted' 도 있음)
      } catch (e) { G = null; }
    },
    setMuted(b) {
      sfx.muted = !!b;
      Store.set('muted', sfx.muted);
      applyMute(true);
    },
    // opts: { vol: 0~2 음량배율, rate: 음높이 배율(0.25~4), delay: 초 }.  절대 throw 하지 않아요
    play(name, opts) {
      try {
        if (sfx.muted || !G) return;
        const def = SOUNDS[name];
        if (!def) return;
        const ac = G.ac;
        if (ac.state !== 'running') return;          // 멈춰 있는 동안 쌓였다가 한꺼번에 터지는 것 방지
        const now = ac.currentTime;
        if (now - (last[name] === undefined ? -1 : last[name]) < T.minGap) return;     // 같은 소리 연타 제한
        live = live.filter(e => e > now);
        if (!def.pri && live.length >= T.maxSounds) return;                             // 동시 재생 제한
        const o = (opts && typeof opts === 'object') ? opts : {};
        const rate = clamp(Number(o.rate) || 1, 0.25, 4);
        const vol = clamp(o.vol === undefined ? 1 : Number(o.vol) || 0, 0, 2);
        const delay = Math.max(0, Number(o.delay) || 0);
        last[name] = now;
        live.push(now + delay + def.dur);
        def.make(makeSynth(G, G.sfxBus, now + 0.005 + delay, rate, vol));
      } catch (e) { /* 소리 때문에 게임이 멈추면 안 됨 */ }
    },
    info(name) { const d = SOUNDS[name]; return d ? { dur: d.dur, pri: !!d.pri } : null; },    // (확인용) 소리 정보
    active() { try { if (G) live = live.filter(e => e > G.ac.currentTime); } catch (e) { /* 무시 */ } return live.length; },
    // (테스트/확인용) 효과음을 오프라인으로 렌더 → Promise<Float32Array>. names: 이름 하나 또는 배열(동시에 울림)
    render(names, opts) {
      try {
        const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        const list = [].concat(names).filter(nm => SOUNDS[nm]);
        if (!OAC || !list.length) return Promise.resolve(new Float32Array(0));
        const rate = (opts && opts.rate) || 1, vol = (opts && opts.vol) === undefined ? 1 : opts.vol;
        const sr = 44100, secs = Math.max(...list.map(nm => SOUNDS[nm].dur)) + 0.2;
        const ac = new OAC(1, Math.ceil(sr * secs), sr);
        const g = makeGraph(ac, true);
        list.forEach(nm => SOUNDS[nm].make(makeSynth(g, g.sfxBus, 0.005, rate, vol)));
        return ac.startRendering().then(buf => buf.getChannelData(0));
      } catch (e) { return Promise.resolve(new Float32Array(0)); }
    },
  };

  // 음소거는 마스터 볼륨으로 (효과음·음악 모두). 음악 스케줄러는 계속 돌아서 켜면 바로 이어짐
  let appliedMute = null;
  function applyMute(force) {
    if (!G) return;
    const m = !!sfx.muted;
    if (!force && m === appliedMute) return;
    appliedMute = m;
    try { G.master.gain.setTargetAtTime(m ? 0 : T.master, G.ac.currentTime, 0.02); } catch (e) { /* 무시 */ }
  }

  // ---- 음악: 코드 몇 줄로 만든 짧은 칩튠 반복 ----
  //   한 칸(step) = 8분음표. 한 마디 = 8칸. 노트는 'C5' 처럼 쓰고 '.' 은 쉼표, '-' 는 앞 음 늘이기
  //   chords: 마디마다 코드(루트+m)   lead: 마디마다 멜로디 8칸   bass/arp/drums: 마디마다 같은 패턴 반복
  //   bass: r=근음 5=5도 o=옥타브   arp: 1 3 5 8 = 코드의 몇 번째 음   drums: k=쿵 s=탁 h=칙

             'C6 . E6 . G6 - E6 C6', 'A5 . D6 . F#6 - D6 A5', 'B5 . D6 . F#6 - D6 B5', 'E6 - D6 B5 G5 - B5 D6'],

      lead: ['A5 . A5 C6 . E6 . D6', 'C6 . C6 D6 . E6 . .', 'A5 . A5 C6 . F6 . E6', 'G#5 . B5 . E6 - D6 B5',
             'D6 . D6 F6 . A5 . C6', 'F6 . F6 E6 . D6 . .', 'A5 . C6 . F6 - E6 C6', 'G#5 B5 E6 B5 G#5 B5 E6 -'],
      bass: 'r r o r r o r 5', arp: '1 3 5 3 1 3 5 8', drums: 'k h s h k k s h',
      inst: { lead: { type: 'sawtooth', lp: 2400, v: 0.12 }, bass: { type: 'square', lp: 600, v: 0.16 }, arp: { type: 'triangle', lp: 0, v: 0.11 } },
    },

  // 데이터 → 칸(step)마다 "어떤 소리를 낼지" 목록으로 미리 풀어 둠
  function buildTrack(def) {
    const bars = def.chords.length, steps = bars * 8;
    const ev = Array.from({ length: steps }, () => []);
    const bad = [];
    const lastEv = {};
    const lane = (name, idx, tok, midi) => {
      if (tok === undefined || tok === '.') return;
      if (tok === '-') {                                         // 앞 음 늘이기 (바로 이어질 때만)
        const l = lastEv[name];
        if (l && l.at + l.len === idx) l.len++;
        return;
      }
      const m = midi(tok);
      if (m === null || m === undefined || isNaN(m)) return;
      lastEv[name] = { lane: name, midi: m, at: idx, len: 1 };
      ev[idx].push(lastEv[name]);
    };
    const bassT = def.bass.trim().split(/\s+/), arpT = def.arp.trim().split(/\s+/), drumT = def.drums.trim().split(/\s+/);
    def.chords.forEach((cn, bar) => {
      const m = /^([A-G])([#b]?)(m?)$/.exec(cn);
      const pc = (NOTE_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12, minor = m[3] === 'm';
      const leadT = def.lead[bar].trim().split(/\s+/);
      if (leadT.length !== 8 || bassT.length !== 8 || arpT.length !== 8 || drumT.length !== 8) bad.push(bar);
      const arpBase = 60 + pc - (pc >= 7 ? 12 : 0);
      for (let i = 0; i < 8; i++) {
        const idx = bar * 8 + i;
        lane('lead', idx, leadT[i], midiOf);
        lane('bass', idx, bassT[i], tok => 36 + pc + ({ r: 0, '5': 7, o: 12 })[tok]);
        lane('arp', idx, arpT[i], tok => arpBase + ({ '1': 0, '3': minor ? 3 : 4, '5': 7, '8': 12 })[tok]);
        if (/^[ksh]$/.test(drumT[i])) ev[idx].push({ lane: 'drum', kind: drumT[i], len: 1 });
      }
    });
    return { bpm: def.bpm, steps, bars, stepDur: 60 / def.bpm / 2, ev, inst: def.inst, bad };
  }
  const TRACKS = {};
  Object.keys(TRACK_DEFS).forEach(k => { TRACKS[k] = buildTrack(TRACK_DEFS[k]); });

  // 한 칸을 시각 t 에 예약 (오디오 시계 기준 — setTimeout 흔들림 없음)
  function scheduleStep(g, bus, tr, idx, t) {
    const s = makeSynth(g, bus, t, 1, 1), d = tr.stepDur, I = tr.inst;
    for (const e of tr.ev[idx]) {
      if (e.lane === 'lead') s.o({ type: I.lead.type, f: hz(e.midi), dur: e.len * d * 0.9, hold: e.len * d * 0.35, v: I.lead.v, lp: I.lead.lp, a: 0.006 });
      else if (e.lane === 'bass') s.o({ type: I.bass.type, f: hz(e.midi), dur: e.len * d * 0.92, v: I.bass.v, lp: I.bass.lp, a: 0.008 });
      else if (e.lane === 'arp') s.o({ type: I.arp.type, f: hz(e.midi), dur: e.len * d * 0.8, v: I.arp.v, lp: I.arp.lp, a: 0.006 });
      else if (e.kind === 'k') s.o({ f: 150, f2: 50, dur: 0.14, v: 0.17 });
      else if (e.kind === 's') { s.n({ type: 'bandpass', f: 1900, q: 0.7, dur: 0.09, v: 0.08 }); s.o({ type: 'triangle', f: 200, f2: 130, dur: 0.07, v: 0.05 }); }
      else if (e.kind === 'h') s.n({ type: 'highpass', f: 7500, dur: 0.03, v: 0.035 });
    }
  }

  let wanted = null, run = null, timer = null;
  function pump() {
    try {
      if (!G || !run) return;
      applyMute(false);                                          // SFX.muted 를 직접 바꿔도 따라가게
      const horizon = G.ac.currentTime + T.lookahead;
      while (run.time < horizon) {
        scheduleStep(G, run.bus, run.track, run.idx, run.time);
        run.time += run.track.stepDur;
        run.idx = (run.idx + 1) % run.track.steps;
      }
    } catch (e) { /* 음악 때문에 게임이 멈추면 안 됨 */ }
  }
  function stopRun(fade) {
    if (run) {
      const old = run; run = null;
      try {
        const now = G.ac.currentTime;
        old.bus.gain.cancelScheduledValues(now);
        old.bus.gain.setValueAtTime(old.bus.gain.value, now);
        old.bus.gain.linearRampToValueAtTime(0, now + fade);
      } catch (e) { /* 무시 */ }
      setTimeout(() => { try { old.bus.disconnect(); } catch (e) { /* 무시 */ } }, (fade + 0.3) * 1000);
    }
    if (!run && timer) { clearInterval(timer); timer = null; }
  }
  function startRun(name) {
    const ac = G.ac, bus = ac.createGain(), now = ac.currentTime;
    bus.gain.setValueAtTime(0, now);
    bus.gain.linearRampToValueAtTime(1, now + 0.08);              // 부드럽게 시작
    bus.connect(G.musicBus);
    run = { name, track: TRACKS[name], idx: 0, time: now + 0.08, bus };
    if (!timer) timer = setInterval(pump, T.pumpMs);
    pump();
  }
  function wakeMusic() { try { if (wanted && G && !run) startRun(wanted); } catch (e) { /* 무시 */ } }

  const music = {
    current: null,
    names: Object.keys(TRACKS),
    // 'title' | 'stage' | 'boss' | null(정지). 같은 곡이면 그대로 두고, 다른 곡이면 부드럽게 바꿔요. 절대 throw 하지 않음
    play(name) {
      try {
        if (!TRACKS[name]) name = null;
        if (name === wanted) return;
        wanted = name; music.current = name;
        stopRun(0.25);
        if (name && G) startRun(name);
      } catch (e) { /* 무시 */ }
    },
    stop() { music.play(null); },
    isPlaying() { return !!run; },
    info(name) {                                                  // (확인용) 곡 정보
      const t = TRACKS[name];
      if (!t) return null;
      const count = lane => t.ev.reduce((n, a) => n + a.filter(e => (lane === 'drum' ? e.lane === 'drum' : e.lane === lane)).length, 0);
      return { bpm: t.bpm, steps: t.steps, bars: t.bars, bad: t.bad.slice(), notes: { lead: count('lead'), bass: count('bass'), arp: count('arp'), drum: count('drum') } };
    },
    // (테스트/확인용) 곡을 오프라인으로 렌더 → Promise<Float32Array>
    render(name, secs) {
      try {
        const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext, tr = TRACKS[name];
        if (!OAC || !tr) return Promise.resolve(new Float32Array(0));
        const sr = 22050, total = secs || 4;
        const ac = new OAC(1, Math.ceil(sr * total), sr), g = makeGraph(ac, true);
        let t = 0.02, i = 0;
        while (t < total) { scheduleStep(g, g.musicBus, tr, i % tr.steps, t); t += tr.stepDur; i++; }
        return ac.startRendering().then(buf => buf.getChannelData(0));
      } catch (e) { return Promise.resolve(new Float32Array(0)); }
    },
  };

  // 탭이 숨겨지면 소리도 멈추고, 돌아오면 이어서 (아이가 다른 탭을 볼 때 음악이 계속 나오지 않게)
  document.addEventListener('visibilitychange', () => {
    try {
      if (!G) return;
      if (document.hidden) { const p = G.ac.suspend(); if (p && p.catch) p.catch(() => {}); }
      else if (G.ac.state === 'suspended') { const p = G.ac.resume(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) { /* 무시 */ }
  });
  // 브라우저는 "사용자가 누른 뒤에만" 소리를 허용 → 첫 클릭/키/터치에서 자동으로 오디오를 깨움
  ['pointerdown', 'mousedown', 'keydown', 'touchend'].forEach(ev => window.addEventListener(ev, () => sfx.init(), { capture: true, passive: true }));

  return [sfx, music];
})();

// ===== 5. FX: 타격감 연출 (히트스톱·흔들림·팝업·입자·번쩍임) =====
const FX = (() => {
  const T = CORE_TUNE.fx;
  const TAU = Math.PI * 2;
  const popups = [], parts = [];
  let shakeMag = 0, shakeT = 0, shakeTotal = 1;
  let fAlpha = 0, fDec = 0, fColor = '#fff', sinceFlash = 999;
  const f = () => RNG.fx();

  // 입자 종류별 기본값
  const KINDS = {
    spark: { count: 8, speed: 5, life: 20, gravity: 0.04, size: 12, lift: 0, drag: 0.92, colors: [COLORS.yellow, COLORS.white, COLORS.cream] },
    star:  { count: 8, speed: 5, life: 42, gravity: 0.16, size: 15, lift: -2.2, drag: 0.96, colors: [COLORS.yellow, COLORS.pink, COLORS.sky, COLORS.mint] },
    candy: { count: 8, speed: 4.6, life: 48, gravity: 0.22, size: 15, lift: -2.6, drag: 0.97, colors: [COLORS.pink, COLORS.mint, COLORS.sky, COLORS.yellow] },
    puff:  { count: 6, speed: 2, life: 28, gravity: -0.02, size: 22, lift: -0.4, drag: 0.94, colors: [COLORS.white, COLORS.cream] },
    ring:  { count: 1, speed: 0, life: 18, gravity: 0, size: 48, lift: 0, drag: 1, colors: [COLORS.white] },
  };

  function shakeOffset() {
    if (shakeT <= 0) { api.shakeOff.x = 0; api.shakeOff.y = 0; return; }
    const k = shakeMag * shakeT / shakeTotal;
    api.shakeOff.x = Math.round((f() * 2 - 1) * k);
    api.shakeOff.y = Math.round((f() * 2 - 1) * k);
  }

  const api = {
    hitstop: 0,                        // 남은 히트스톱 프레임 (Loop 가 줄임)
    shakeOff: { x: 0, y: 0 },          // 이번 프레임 화면 흔들림 (Cam.apply 가 읽음)
    popups, particles: parts,          // (읽기 전용) 현재 살아 있는 팝업/입자
    reduceMotion: !!Store.get('reduceMotion', false),   // 켜면 흔들림 없고 번쩍임 약하게
    get flashAlpha() { return fAlpha; },
    get flashColor() { return fColor; },

    // 히트스톱: 남은 프레임을 max(현재, n) 로
    freeze(n) {
      n = Math.round(Number(n)) || 0;
      if (n > 0) api.hitstop = Math.max(api.hitstop, Math.min(n, T.maxFreeze));
    },
    // 화면 흔들림: 더 센 흔들림이 우선
    shake(mag, frames) {
      mag = Math.min(Number(mag) || 0, T.maxShake);
      frames = Math.round(Number(frames)) || 0;
      if (api.reduceMotion) mag *= 0.3;
      if (mag <= 0 || frames <= 0) return;
      const cur = shakeT > 0 ? shakeMag * shakeT / shakeTotal : 0;
      if (mag >= cur) { shakeMag = mag; shakeT = shakeTotal = frames; shakeOffset(); }
    },
    // 위로 떠오르는 글자 (x: 월드 x, y: 화면 y). 동시에 최대 40개 — 넘치면 가장 오래된 것부터 사라짐
    popup(x, y, text, o) {
      o = o || {};
      x = Number(x); y = Number(y);
      if (!isFinite(x) || !isFinite(y)) return;
      if (popups.length >= T.maxPopups) popups.shift();
      popups.push({
        x, y, text: String(text), t: 0,
        color: o.color || COLORS.white, size: o.size || 26,
        life: o.life === undefined ? 40 : o.life, vy: o.vy === undefined ? -1.1 : o.vy,
      });
    },
    // 입자 터뜨리기. kind: spark(반짝) / star(별) / candy(사탕) / puff(뭉게) / ring(동그란 파동). 전체 최대 300개
    burst(x, y, o) {
      o = o || {};
      x = Number(x); y = Number(y);
      if (!isFinite(x) || !isFinite(y)) return;
      const kind = KINDS[o.kind] ? o.kind : 'spark', d = KINDS[kind];
      const count = clamp(Math.round(o.count === undefined ? d.count : Number(o.count) || 0), 0, 80);
      const colors = (o.colors && o.colors.length) ? o.colors : d.colors;
      const num = (v, dflt) => (typeof v === 'number' && isFinite(v) ? v : dflt);                 // 숫자가 아니면 기본값
      const speed = num(o.speed, d.speed), life = Math.max(2, num(o.life, d.life));
      const size = Math.max(1, num(o.size, d.size)), gravity = num(o.gravity, d.gravity);          // 음수 크기로 캔버스가 오류 내지 않게
      const over = parts.length + count - T.maxParticles;
      if (over > 0) parts.splice(0, over);                       // 자리가 모자라면 오래된 것부터 지움
      for (let i = 0; i < count; i++) {
        const ang = f() * TAU, sp = speed * (0.45 + f() * 0.75);
        parts.push({
          kind, x, y, age: 0, life: Math.max(2, Math.round(life * (0.8 + f() * 0.4))),
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp + d.lift * (speed / (d.speed || 1)),
          g: gravity, drag: d.drag, size: size * (kind === 'ring' ? 1 : 0.7 + f() * 0.6),
          color: colors[Math.floor(f() * colors.length)], rot: f() * TAU, vr: (f() - 0.5) * 0.4,
          delay: kind === 'ring' ? i * 4 : 0,
        });
      }
    },
    // 화면 전체 번쩍. 진하기 상한 + 20프레임 안에 또 번쩍이면 합쳐서 "깜빡깜빡"이 생기지 않게 (광과민성 안전)
    flash(color, frames) {
      frames = clamp(Math.round(Number(frames)) || 10, 1, T.flashMaxFrames);
      if (sinceFlash < T.flashMinGap) {                          // 합치기: 진하기는 올리지 않고, 사라지는 시간만 늘림
        if (fAlpha > 0.003) fDec = Math.min(fDec, fAlpha / frames);
        return;
      }
      fAlpha = api.reduceMotion ? 0.2 : T.flashMaxAlpha;
      fDec = fAlpha / frames;
      fColor = color || '#fff';
      sinceFlash = 0;
    },

    // play 씬이 매 프레임 1회 (히트스톱 중엔 호출되지 않음 → 연출도 같이 멈춤)
    update() {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        if (p.delay > 0) { p.delay--; continue; }
        if (++p.age >= p.life) { parts.splice(i, 1); continue; }
        p.x += p.vx; p.y += p.vy;
        p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;               // 공기저항 + 중력
        p.rot += p.vr;
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.t++; p.y += p.vy; p.vy *= 0.97;
        if (p.t >= p.life) popups.splice(i, 1);
      }
      if (shakeT > 0) shakeT--;
      shakeOffset();
      sinceFlash++;
      fAlpha = Math.max(0, fAlpha - fDec);
    },

    // 카메라 변환 안에서: 입자 → 팝업
    drawWorld(ctx) {
      for (const p of parts) {
        if (p.delay > 0) continue;
        const prog = p.age / p.life, k = 1 - prog;
        ctx.save();
        ctx.globalAlpha = Math.min(1, k * 2.2);                  // 마지막 45% 동안 서서히 사라짐
        DRAW_PART[p.kind](ctx, p, prog, k);
        ctx.restore();
      }
      for (const p of popups) {
        const left = p.life - p.t;
        const pop = p.t < 6 ? 1 + (1 - p.t / 6) * 0.5 : 1;       // 톡 튀어나오는 느낌
        Draw.text(ctx, p.text, p.x, p.y, { size: p.size * pop, color: p.color, alpha: left < 12 ? Math.max(0, left / 12) : 1, lw: 5 });
      }
    },
    // 카메라 변환 밖에서: 번쩍임
    drawScreen(ctx) {
      if (fAlpha <= 0.003) return;
      ctx.save();
      ctx.globalAlpha = Math.min(fAlpha, 0.6);
      ctx.fillStyle = fColor;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    },
    clear() {
      popups.length = 0; parts.length = 0;
      api.hitstop = 0; shakeMag = 0; shakeT = 0; shakeTotal = 1;
      api.shakeOff.x = 0; api.shakeOff.y = 0;
      fAlpha = 0; fDec = 0; sinceFlash = 999;
    },
  };

  // 입자 그리기 (전부 벡터 도형: 둥글고 귀엽게, 굵은 윤곽선)
  const DRAW_PART = {
    spark(ctx, p, prog, k) {                                     // 반짝이는 네 갈래 별
      const s = p.size * (0.35 + 0.65 * k);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.strokeStyle = 'rgba(43,27,58,.6)'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.26, -s * 0.26); ctx.lineTo(s, 0); ctx.lineTo(s * 0.26, s * 0.26);
      ctx.lineTo(0, s); ctx.lineTo(-s * 0.26, s * 0.26); ctx.lineTo(-s, 0); ctx.lineTo(-s * 0.26, -s * 0.26);
      ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, s * 0.2, 0, TAU); ctx.fill();
    },
    star(ctx, p, prog, k) {                                      // 통통한 오각별
      const s = p.size * (0.5 + 0.5 * Math.min(1, k * 1.6));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = COLORS.ink; ctx.fillStyle = p.color;
      Draw.star(ctx, 0, 0, s, s * 0.5, 0);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(-s * 0.18, -s * 0.2, s * 0.13, 0, TAU); ctx.fill();
    },
    candy(ctx, p, prog, k) {                                     // 포장지 사탕
      const s = p.size * (0.55 + 0.45 * Math.min(1, k * 1.6));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.lineJoin = 'round'; ctx.lineWidth = 2.2; ctx.strokeStyle = COLORS.ink; ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(-s * 0.5, 0); ctx.lineTo(-s * 1.3, -s * 0.6); ctx.lineTo(-s * 1.3, s * 0.6); ctx.closePath();
      ctx.moveTo(s * 0.5, 0); ctx.lineTo(s * 1.3, -s * 0.6); ctx.lineTo(s * 1.3, s * 0.6); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, s * 0.66, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, s * 0.38, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
    },
    puff(ctx, p, prog, k) {                                      // 몽글몽글 연기
      ctx.globalAlpha *= 0.65;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + prog * 0.9), 0, TAU); ctx.fill();
    },
    ring(ctx, p, prog, k) {                                      // 퍼져 나가는 동그란 파동
      const e = 1 - (1 - prog) * (1 - prog), r = p.size * (0.2 + 0.8 * e), lw = 1.5 + 5 * k;
      ctx.lineWidth = lw + 3; ctx.strokeStyle = 'rgba(43,27,58,.35)';                       // 밝은 배경에서도 보이도록 어두운 테두리
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = p.color; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
    },
  };
  return api;
})();

// ===== 6. Entities: 모든 캐릭터/물건의 목록과 물리 =====
const Entities = (() => {
  // Entities.list 는 "살아있는 배열"(같은 배열 객체가 계속 유지됨). 다만 for-of / forEach 로 돌 때는 그 순간의 복사본을 돌게 해서,
  // 돌면서 Entities.add / remove 를 해도 건너뛰는 일이 없게 했어요. (length, includes, indexOf, filter … 는 평범한 배열처럼 동작)
  class EntityList extends Array {
    static get [Symbol.species]() { return Array; }                              // slice/filter/map 의 결과는 그냥 배열
    [Symbol.iterator]() { return Array.prototype.slice.call(this)[Symbol.iterator](); }
    forEach(fn, thisArg) { Array.prototype.slice.call(this).forEach(fn, thisArg); }
  }
  const list = new EntityList();
  let nextId = 1;
  const P = CORE_TUNE.physics;

  function guard(e, what, fn) {                                  // 한 엔티티의 오류가 프레임 전체를 멈추지 않게
    try { fn(); } catch (err) { Debug.logOnce(`entity ${e.type || e.kind || '?'}.${what}`, err); }
  }

  // 한 프레임치 물리 (계약서 3-8)
  function physics(e) {
    const air = (e.z > 0 || e.vz > 0) && !e.noGravity;           // 이동 전에 "공중인지" 판단 (프로토타입과 같은 순서)
    e.x += e.vx + e.kx; e.y += e.vy; e.z += e.vz;
    e.vx = 0; e.vy = 0;                                          // vx, vy 는 "한 프레임짜리 이동 의도"
    e.kx *= P.kxDecay;
    if (Math.abs(e.kx) < P.kxMin) e.kx = 0;
    let landed = false;
    if (air) {
      e.vz -= GRAVITY;
      if (e.z <= 0 && e.vz <= 0) { e.z = 0; e.vz = 0; e._juggle = 0; landed = true; }
    } else if (e.z < 0) { e.z = 0; if (e.vz < 0) e.vz = 0; }
    if (e.clampWorld) {
      const hw = e.w / 2;
      e.x = clamp(e.x, hw, Game.world.width - hw);
      e.y = clamp(e.y, FLOOR_TOP, FLOOR_BOTTOM);
    }
    if (e.flash > 0) e.flash--;
    if (e.invuln > 0) e.invuln--;
    if (e.stun > 0 && e.z <= 0) e.stun--;                        // 공중에서는 경직이 풀리지 않음
    if (landed && e.onLand) guard(e, 'onLand', () => e.onLand(e));
    if (e.dead && !e.persistent && e.z <= 0 && !e._removed) {    // 바닥에 닿은 뒤 removeT 프레임이 지나면 제거
      if (!(--e.removeT > 0)) api.remove(e);                      // (removeT 가 NaN/undefined 여도 제거됨)
    }
  }

  const api = {
    list,
    make(props) {
      const e = {
        id: 0, kind: '', team: 'neutral',
        x: 0, y: 420, z: 0, vx: 0, vy: 0, vz: 0, kx: 0,
        w: 40, h: 80, face: 1, hp: 1, maxHp: 1,
        dead: false, removeT: 0, stun: 0, flash: 0, invuln: 0,
        superArmor: false, heavy: false, noGravity: false, untargetable: false,
        persistent: false, clampWorld: true, shadow: true, layer: undefined,
        tick: null, update: null, draw: null, onHit: null, onDeath: null, onLand: null,
        _juggle: 0,
      };
      if (props) for (const k in props) if (props[k] !== undefined) e[k] = props[k];     // undefined 는 건너뜀 (opts.z 가 비어 있어도 z 가 NaN 이 되지 않게)
      if (!props || props.hp === undefined) { if (props && props.maxHp !== undefined) e.hp = e.maxHp; }   // maxHp 만 주면 꽉 찬 체력
      e.id = nextId++;
      return e;
    },
    add(e) {
      if (!e || e._in) return e;
      e._in = true; e._removed = false;
      list.push(e);
      return e;
    },
    remove(e) {
      if (!e || !e._in) return;
      e._in = false; e._removed = true;                          // 순회 중이던 프레임에서도 건너뛰게 표시
      const i = list.indexOf(e);
      if (i >= 0) list.splice(i, 1);
    },
    clear() {
      for (const e of list) { e._in = false; e._removed = true; }
      list.length = 0;
    },
    byTeam(team) { return list.filter(e => !e.dead && e.team === team); },

    // 매 프레임: tick(항상) → update(살아 있고 경직 아닐 때) → 물리
    updateAll() {
      for (const e of list.slice()) {                            // 복사본을 돌아서 순회 중 add/remove 가 안전
        if (e._removed) continue;
        if (e.tick) guard(e, 'tick', () => e.tick(e));
        if (e._removed) continue;
        if (!e.dead && e.stun <= 0 && e.update) guard(e, 'update', () => e.update(e));
        if (e._removed) continue;
        physics(e);
      }
    },

    // 그림자 전부 → 바닥 마커(layer:'ground') → 나머지를 y(그다음 id) 순서로 (y 가 클수록 앞)
    drawAll(ctx) {
      const all = list.slice().sort((a, b) => (a.y - b.y) || (a.id - b.id));
      for (const e of all) if (e.shadow !== false) guard(e, 'shadow', () => Draw.shadow(ctx, e));
      const drawOne = e => {
        if (!e.draw || e._removed) return;
        ctx.save();
        try { e.draw(ctx, e); } catch (err) { Debug.logOnce(`entity ${e.type || e.kind || '?'}.draw`, err); }
        ctx.restore();
      };
      for (const e of all) if (e.layer === 'ground') drawOne(e);
      for (const e of all) if (e.layer !== 'ground') drawOne(e);
      if (Debug.showHitboxes) Debug.drawHitboxes(ctx);
    },
  };
  return api;
})();

// ===== 7. Combat: 타격 판정과 피해 처리 =====
const Combat = (() => {
  const D = CORE_TUNE.combat;

  // 넉백 방향: hb.dir 이 있으면 그대로, 없으면 "공격자의 반대쪽"
  function knockDir(target, hb) {
    if (hb.dir) return hb.dir > 0 ? 1 : -1;
    const o = hb.owner;
    if (o) {
      const d = target.x - o.x;
      return d !== 0 ? (d > 0 ? 1 : -1) : (o.face || 1);
    }
    if (typeof hb.x1 === 'number' && typeof hb.x2 === 'number') {
      const d = target.x - (hb.x1 + hb.x2) / 2;
      if (d !== 0) return d > 0 ? 1 : -1;
    }
    return -(target.face || 1);                                  // 방향 정보가 없으면 뒤로 밀림
  }

  // 피해 처리 8단계 (계약서 3-9). 반환: 실제로 들어간 피해량 (무시됐으면 0)
  function damage(target, amount, hb) {
    // 1. 죽었거나 / 대상 제외거나 / 무적이면 무시
    if (!target || target.dead || target.untargetable || target.invuln > 0) return 0;
    const playerSide = target.team === 'player';
    if (Debug.god && playerSide) return 0;
    hb = hb || {};

    // 2. 피해량: ±10% 흔들림, 플레이어팀이 맞으면 난이도 배율, 최소 1, 반올림
    let dmg = Number(amount) || 0;
    if (!Debug.noVariance) dmg *= 1 - D.variance + rand() * D.variance * 2;
    if (playerSide) dmg *= Game.diff.dmgTaken;
    dmg = Math.max(1, Math.round(dmg));

    // 3. 체력 감소 + 번쩍 + 팝업 + 입자 + 효과음 + 히트스톱 + 흔들림
    target.hp -= dmg;
    target.flash = D.flashFrames;
    const dir = knockDir(target, hb);
    const topY = target.y - target.z - target.h;
    FX.popup(target.x + (RNG.fx() - 0.5) * 16, topY - 6, dmg, playerSide
      ? { color: COLORS.red, size: 30, life: D.popupLife }
      : { color: (hb.launch > 0 || dmg >= 15) ? COLORS.yellow : COLORS.white, size: clamp(22 + dmg * 0.35, 22, 40), life: D.popupLife });
    const fxKind = hb.fx === undefined ? 'spark' : hb.fx;
    if (fxKind) FX.burst(target.x - dir * target.w * 0.25, target.y - target.z - target.h * 0.55, { kind: fxKind, count: clamp(Math.round(4 + dmg * 0.25), 5, 12) });
    const sfxName = hb.sfx === undefined ? 'hit' : hb.sfx;
    if (sfxName) SFX.play(sfxName);
    FX.freeze(hb.freeze === undefined ? D.freeze : hb.freeze);
    if (hb.shake) FX.shake(hb.shake, 10);

    // 4. 슈퍼아머가 아니면 넉백·경직·띄우기 (이미 공중이면 저글링)
    if (!target.superArmor) {
      const knock = hb.knock === undefined ? D.knock : hb.knock;
      if (knock) target.kx = dir * knock;
      const stun = hb.stun === undefined ? D.stun : hb.stun;
      if (stun > 0) target.stun = Math.max(target.stun, stun);
      if (!target.heavy) {
        if (hb.launch > 0) target.vz = hb.launch;
        else if (target.z > 0 && (target._juggle || 0) < D.juggleMax) {
          target.vz = Math.max(target.vz, D.juggleLift);
          target._juggle = (target._juggle || 0) + 1;
        }
      }
    }

    // 5. 플레이어가 맞으면: 무적 시간 + 콤보 끊김
    if (target.kind === 'player') {
      target.invuln = CFG.playerInvuln;
      const c = Game.combo;
      if (c.count > 0) { c.count = 0; c.timer = 0; Events.emit('comboChanged', { count: 0, max: c.max }); }
    }

    // 6. 때린 쪽이 플레이어팀이면 콤보 +1
    const atkTeam = hb.team !== undefined ? hb.team : (hb.owner ? hb.owner.team : undefined);
    if (atkTeam === 'player') {
      const c = Game.combo;
      c.count++; c.timer = CFG.comboWindow;
      if (c.count > c.max) c.max = c.count;
      Events.emit('comboChanged', { count: c.count, max: c.max });
    }

    // 7. 피격 훅 + 이벤트
    if (target.onHit) { try { target.onHit(target, hb, dmg); } catch (e) { Debug.logOnce('onHit', e); } }
    Events.emit('entityHit', { target, hb, dmg });
    if (target.kind === 'player') Events.emit('playerHit', { target, hb, dmg });

    // 8. 체력이 0 이하면 쓰러짐: onDeath 훅 → 이벤트 (enemyKilled/bossKilled/playerDied 는 커널이 전담)
    if (target.hp <= 0) {
      target.hp = 0; target.dead = true;
      if (target.onDeath) { try { target.onDeath(target, hb); } catch (e) { Debug.logOnce('onDeath', e); } }
      Events.emit('entityDied', { target, hb });
      if (target.team === 'enemy') { Game.kills++; Events.emit('enemyKilled', target); }
      if (target.boss === true) Events.emit('bossKilled', target);
      if (target.kind === 'player') Events.emit('playerDied', target);
    }
    return dmg;
  }

  const api = {
    // 공격 사각형 안(x) · 비슷한 깊이(y) · 겹치는 높이(z) 의 상대 팀을 때린다. 이번에 새로 맞은 엔티티들을 돌려줌
    applyHitbox(hb) {
      const owner = hb.owner;
      const team = hb.team !== undefined ? hb.team : (owner ? owner.team : undefined);
      if (!hb.hitSet) hb.hitSet = new Set();                     // 한 번 휘두를 때 한 번만 맞게
      const x1 = Math.min(hb.x1, hb.x2), x2 = Math.max(hb.x1, hb.x2);
      const y = hb.y !== undefined ? hb.y : (owner ? owner.y : undefined);
      const depth = hb.depth === undefined ? D.depth : hb.depth;
      const zMin = hb.zMin !== undefined ? hb.zMin : (owner ? owner.z - 10 : -Infinity);
      const zMax = hb.zMax !== undefined ? hb.zMax : (owner ? owner.z + owner.h : Infinity);
      if (Debug.showHitboxes) Debug.recordHitbox({ x1, x2, y: y === undefined ? 0 : y, depth, zMin, zMax, team });
      const hits = [];
      for (const e of Entities.list.slice()) {
        if (e._removed || e.dead || e.untargetable || e === owner) continue;
        if (e.team === team || e.team === 'neutral') continue;
        if (hb.hitSet.has(e)) continue;
        if (!(e.x + e.w / 2 > x1 && e.x - e.w / 2 < x2)) continue;                 // 가로(x) 겹침
        if (y !== undefined && !(Math.abs(e.y - y) < depth)) continue;              // 깊이(y) — 벨트스크롤의 핵심
        if (!(e.z < zMax && e.z + e.h > zMin)) continue;                            // 높이(z) 겹침
        if (damage(e, hb.damage, hb) > 0) { hb.hitSet.add(e); hits.push(e); }       // 무적 등으로 무시되면 "맞은 것"으로 치지 않음
      }
      return hits;
    },
    // owner 가 바라보는 쪽 사각형 (넉백은 바라보는 쪽으로)
    frontBox(owner, reach, extra) {
      const x1 = owner.face > 0 ? owner.x : owner.x - reach;
      const x2 = owner.face > 0 ? owner.x + reach : owner.x;
      return Object.assign({ owner, team: owner.team, x1, x2, y: owner.y, dir: owner.face }, extra);
    },
    // owner 좌우 대칭 사각형 (넉백은 owner 에게서 멀어지는 쪽으로)
    aroundBox(owner, rx, extra) {
      return Object.assign({ owner, team: owner.team, x1: owner.x - rx, x2: owner.x + rx, y: owner.y }, extra);
    },
    damage,
  };
  return api;
})();

// ===== 8. Cam, Draw =====
const Cam = {
  x: 0,                                                          // 화면 왼쪽 끝의 월드 x
  follow(target) {                                               // 부드럽게 추적
    if (!target) return;
    Cam.x += (target.x - W / 2 - Cam.x) * 0.12;
    Cam.x = clamp(Cam.x, 0, Math.max(0, Game.world.width - W));
  },
  snap(target) {                                                 // 즉시 이동 (방 전환 직후)
    target = target || Game.player;
    Cam.x = clamp(target ? target.x - W / 2 : Cam.x, 0, Math.max(0, Game.world.width - W));
  },
  apply(ctx) {                                                   // 짝: ctx.restore()
    ctx.save();
    ctx.translate(-Math.round(Cam.x) + FX.shakeOff.x, FX.shakeOff.y);
  },
};

const Draw = {
  // 윤곽선 글자. y 는 글자 "밑줄(baseline)" 위치. 여러 줄은 '\n'. 가장 긴 줄의 너비를 돌려줌
  text(ctx, str, x, y, o) {
    o = o || {};
    const size = o.size === undefined ? 20 : o.size;
    const lines = String(str).split('\n');
    ctx.save();
    ctx.globalAlpha *= o.alpha === undefined ? 1 : o.alpha;
    ctx.font = `${o.weight || 'bold'} ${size}px ${CFG.font}`;
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = o.baseline || 'alphabetic';
    ctx.lineJoin = 'round'; ctx.miterLimit = 2;
    const stroke = o.stroke === undefined ? COLORS.ink : o.stroke, lw = o.lw === undefined ? 4 : o.lw;
    let widest = 0;
    lines.forEach((ln, i) => {
      const yy = y + i * size * 1.2;
      if (stroke && lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(ln, x, yy); }
      ctx.fillStyle = o.color || '#fff';
      ctx.fillText(ln, x, yy);
      widest = Math.max(widest, ctx.measureText(ln).width);
    });
    ctx.restore();
    return widest;
  },
  // 체력바. ratio 는 0~1 로 맞춰서 그림
  bar(ctx, x, y, w, h, ratio, o) {
    o = o || {};
    const r = clamp(typeof ratio === 'number' && ratio === ratio ? ratio : 0, 0, 1);   // NaN/숫자가 아니면 0, ±Infinity 도 0~1 안으로
    const border = o.border === undefined ? COLORS.ink : o.border;
    ctx.save();
    Draw.roundRect(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = o.bg || 'rgba(43,27,58,.55)'; ctx.fill();
    if (r > 0) {
      ctx.save();
      Draw.roundRect(ctx, x, y, w, h, h / 2); ctx.clip();
      ctx.fillStyle = o.fg || COLORS.mint; ctx.fillRect(x, y, w * r, h);
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x, y + h * 0.12, w * r, h * 0.28);   // 반짝 하이라이트
      ctx.restore();
    }
    if (border) {
      Draw.roundRect(ctx, x, y, w, h, h / 2);
      ctx.lineWidth = o.lw === undefined ? clamp(h / 4, 1.5, 3) : o.lw; ctx.strokeStyle = border; ctx.stroke();
    }
    ctx.restore();
  },
  // 둥근 사각형 path 만 만든다 (fill/stroke/clip 은 부르는 쪽에서)
  roundRect(ctx, x, y, w, h, r) {
    r = clamp(r || 0, 0, Math.min(Math.abs(w), Math.abs(h)) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
  // (덤) 별 모양 path. rOuter=뾰족한 끝, rInner=안쪽 오목한 곳
  star(ctx, x, y, rOuter, rInner, rot, points) {
    const n = clamp(Math.round(points) || 5, 3, 24);                       // 꼭짓점 수 (이상한 값에 무한 반복하지 않게)
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 === 0 ? rOuter : rInner, a = (rot || 0) - Math.PI / 2 + i * Math.PI / n;
      if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath();
  },
  // 그림자: 항상 (x, y) 바닥에. 높이 뜰수록 작고 옅게
  shadow(ctx, e) {
    const s = 1 - Math.min(Math.max(e.z, 0), 140) / 280;
    const rx = Math.max(8, e.w * 0.62 * s), ry = rx * 0.3;
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.14 * s;
    ctx.fillStyle = COLORS.ink;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  },
};

// ===== 9. Scenes, Loop, Debug =====
const Scenes = {};   // 각 모듈이 채움: Scenes.title / Scenes.play / Scenes.result = { enter(), exit(), update(), draw(ctx) } (전부 생략 가능)

// 기본 'boot' 씬: 다른 모듈이 아직 없을 때 보이는 로딩 화면
Scenes.boot = {
  draw(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, COLORS.night); g.addColorStop(1, '#4a3f6b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    Draw.text(ctx, '로딩 중...', W / 2, H / 2 + 8, { size: 44, color: COLORS.cream });
    const t = Loop.tickCount;
    [COLORS.pink, COLORS.sky, COLORS.mint].forEach((c, i) => {   // 통통 튀는 젤리 방울 세 개
      const bounce = Math.abs(Math.sin((t + i * 8) * 0.12)) * 16;
      const x = W / 2 + (i - 1) * 36, y = H / 2 + 70 - bounce;
      ctx.fillStyle = c; ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, y, 11, 10 + bounce * 0.05, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
  },
};

const Debug = (() => {
  const seen = new Set();
  const boxes = [];
  return {
    god: false,                  // true 면 플레이어팀이 피해를 받지 않음 (테스트/봇 용)
    noVariance: false,           // true 면 피해량 ±10% 흔들림 없음 (정확한 숫자 검사용)
    showHitboxes: false,         // true 면 공격 판정 사각형을 화면에 그림 (밸런싱 용)
    errors: [],                  // 최근에 로그한 서로 다른 오류들
    // 같은 오류 메시지는 한 번만 console.error (매 프레임 반복 출력 방지)
    logOnce(tag, err) {
      const msg = tag + ': ' + ((err && err.message) || err);
      if (seen.has(msg)) return;
      if (seen.size > 200) seen.clear();
      seen.add(msg);
      Debug.errors.push(msg);
      if (Debug.errors.length > 50) Debug.errors.shift();
      console.error('[' + tag + ']', err);
    },
    recordHitbox(b) { b.t = 8; boxes.push(b); if (boxes.length > 40) boxes.shift(); },
    drawHitboxes(ctx) {
      ctx.save();
      for (let i = boxes.length - 1; i >= 0; i--) {
        const b = boxes[i];
        ctx.strokeStyle = b.team === 'player' ? 'rgba(80,200,255,.9)' : 'rgba(255,90,90,.9)';
        ctx.fillStyle = b.team === 'player' ? 'rgba(80,200,255,.18)' : 'rgba(255,90,90,.18)';
        ctx.lineWidth = 2;
        ctx.fillRect(b.x1, b.y - b.depth, b.x2 - b.x1, b.depth * 2);
        ctx.strokeRect(b.x1, b.y - b.depth, b.x2 - b.x1, b.depth * 2);
        if (--b.t <= 0) boxes.splice(i, 1);
      }
      ctx.restore();
    },
  };
})();

const Loop = (() => {
  const STEP = CORE_TUNE.loop.stepMs;
  let acc = 0, lastTs = 0;

  // 캔버스를 화면 선명도(devicePixelRatio, 최대 2)에 맞추기. 그리기 좌표는 항상 논리 960x540
  function fit() {
    const cv = api.canvas;
    if (!cv) return false;
    const dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    const tw = Math.round(W * dpr), th = Math.round(H * dpr);
    if (cv.width !== tw || cv.height !== th) { cv.width = tw; cv.height = th; }   // (바꾸면 내용이 지워지므로 달라질 때만)
    api.dpr = dpr;
    return true;
  }

  const api = {
    started: false,
    manual: false,               // true 면 RAF 루프는 그리기만 하고 update 는 안 함 (테스트가 step 으로만 진행)
    hooks: [],                   // 매 tick update 직전에 호출되는 함수들 (봇/디버그 용)
    tickCount: 0,                // 실행된 tick 총 수 (일시정지 제외, 히트스톱 포함)
    canvas: null, ctx: null, dpr: 1,

    // 고정 update 1회
    tick() {
      if (Game.paused) return;
      api.tickCount++;
      for (const h of api.hooks.slice()) { try { h(); } catch (e) { Debug.logOnce('Loop.hooks', e); } }
      if (FX.hitstop > 0) { FX.hitstop--; return; }              // 히트스톱: 입력 버퍼가 유지되도록 endFrame 을 부르지 않음
      const sc = Scenes[Game.scene];
      if (sc && sc.update) { try { sc.update(); } catch (e) { Debug.logOnce(`Scenes.${Game.scene}.update`, e); } }
      if (Game.scene === 'play') Game.frame++;
      Input.endFrame();
    },
    step(n) { for (let i = 0; i < n; i++) api.tick(); },        // 그리기 없이 n번 (테스트용)

    // 그리기 1회 (RAF 가 매번 부름. 테스트에서 직접 불러 화면을 확정할 수도 있음)
    draw() {
      if (!fit()) return;
      const ctx = api.ctx || (api.ctx = api.canvas.getContext('2d'));
      if (!ctx) return;
      ctx.setTransform(api.dpr, 0, 0, api.dpr, 0, 0);           // 모든 모듈이 논리 좌표(960x540)로 그리게
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);
      const sc = Scenes[Game.scene];
      if (!sc || !sc.draw) return;
      try { sc.draw(ctx); }
      catch (e) {
        Debug.logOnce(`Scenes.${Game.scene}.draw`, e);
        for (let i = 0; i < 64; i++) ctx.restore();             // 오류로 짝이 안 맞는 save 들을 정리
      }
    },

    start() {
      if (api.started) return;
      api.started = true;
      api.canvas = document.getElementById('game');
      if (api.canvas) {
        // 비상용 스타일: UI 의 CSS 가 없을 때만 적용되는(우선순위 0) 기본 크기. canvas.width 를 dpr 배로 키우므로 CSS 크기를 고정해 둠
        const st = document.createElement('style');
        st.textContent = ':where(#game){display:block;width:960px}';
        document.head.appendChild(st);
      }
      fit();
      window.addEventListener('resize', () => { fit(); api.draw(); });
      lastTs = performance.now();
      const frame = now => {
        requestAnimationFrame(frame);                            // 오류가 나도 루프가 끊기지 않게 맨 먼저 예약
        let dt = Math.max(0, now - lastTs);
        lastTs = now;
        if (Math.abs(dt - STEP) < 1.2) dt = STEP;               // 60Hz 화면에서 미세한 떨림 보정
        if (api.manual) acc = 0;
        else {
          acc += Math.min(dt, CORE_TUNE.loop.maxDtMs);          // 탭을 오래 떠났다 와도 폭주하지 않게
          while (acc >= STEP) { api.tick(); acc -= STEP; }
        }
        api.draw();
      };
      requestAnimationFrame(frame);
    },
  };
  return api;
})();
</script>
